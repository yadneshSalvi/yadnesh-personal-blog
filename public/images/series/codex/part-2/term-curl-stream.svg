<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="928" viewBox="0 0 1040 928" font-family="'SF Mono', Menlo, Consolas, monospace">
  <rect width="1040" height="928" fill="#1a1816"/>
  <rect width="1040" height="48" fill="#211e1a"/>
  <circle cx="28" cy="24" r="7" fill="#3a3530"/>
  <circle cx="52" cy="24" r="7" fill="#3a3530"/>
  <circle cx="76" cy="24" r="7" fill="#3a3530"/>
  <text x="520" y="30" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#756d62" text-anchor="middle" letter-spacing="1">terminal &#183; watching the belt</text>
  <g font-size="14.5" fill="#d8d2c6">
    <text x="32" y="88" xml:space="preserve"><tspan fill="#756d62">$</tspan> curl -N localhost:8000/chat -H 'content-type: application/json' \</text>
    <text x="32" y="116" xml:space="preserve">    -d '{"message": "Build a single-page site for Beanline, a specialty coffee</text>
    <text x="32" y="144" xml:space="preserve">         chain: warm, editorial, a hero and a menu section. &#8230;"}'</text>
    <text x="32" y="172" xml:space="preserve"></text>
    <text x="32" y="200" xml:space="preserve">data: {"type": <tspan fill="#e5825a">"session_start"</tspan>, "session_id": "019f389a-9927-7922-9f4c-6f0599e4ac40"}</text>
    <text x="32" y="228" xml:space="preserve"></text>
    <text x="32" y="256" xml:space="preserve"><tspan fill="#756d62"># the first parcels: the agent thinks before it types</tspan></text>
    <text x="32" y="284" xml:space="preserve">data: {"type": <tspan fill="#e5825a">"item_start"</tspan>, "item_id": "rs_0388c9de&#8230;", "kind": <tspan fill="#6fa8dc">"reasoning"</tspan>, "detail": {}}</text>
    <text x="32" y="312" xml:space="preserve">data: {"type": <tspan fill="#e5825a">"item_done"</tspan>,  "item_id": "rs_0388c9de&#8230;", "kind": <tspan fill="#6fa8dc">"reasoning"</tspan>, "detail": {}}</text>
    <text x="32" y="340" xml:space="preserve"></text>
    <text x="32" y="368" xml:space="preserve"><tspan fill="#756d62"># prose arrives as a run of text_delta parcels, a word or two each</tspan></text>
    <text x="32" y="396" xml:space="preserve">data: {"type": <tspan fill="#e5825a">"item_start"</tspan>, "item_id": "msg_0388c9de&#8230;", "kind": <tspan fill="#6fa8dc">"agentMessage"</tspan>, "detail": {}}</text>
    <text x="32" y="424" xml:space="preserve">data: {"type": <tspan fill="#e5825a">"text_delta"</tspan>, "text": "I"}</text>
    <text x="32" y="452" xml:space="preserve">data: {"type": <tspan fill="#e5825a">"text_delta"</tspan>, "text": "\u2019m"}</text>
    <text x="32" y="480" xml:space="preserve">data: {"type": <tspan fill="#e5825a">"text_delta"</tspan>, "text": " checking"}</text>
    <text x="32" y="508" xml:space="preserve">data: {"type": <tspan fill="#e5825a">"text_delta"</tspan>, "text": " the"}</text>
    <text x="32" y="536" xml:space="preserve">data: {"type": <tspan fill="#e5825a">"text_delta"</tspan>, "text": " existing"}</text>
    <text x="32" y="564" xml:space="preserve"><tspan fill="#756d62"># &#8230; 379 text_delta parcels in this turn &#8230;</tspan></text>
    <text x="32" y="592" xml:space="preserve"></text>
    <text x="32" y="620" xml:space="preserve"><tspan fill="#756d62"># commands and file edits ride the same belt, labeled by kind</tspan></text>
    <text x="32" y="648" xml:space="preserve">data: {"type": <tspan fill="#e5825a">"item_start"</tspan>, "item_id": "call_onv9Cb&#8230;", "kind": <tspan fill="#6fa8dc">"commandExecution"</tspan>,</text>
    <text x="32" y="676" xml:space="preserve">       "detail": {"command": "/bin/zsh -lc 'rg --files'"}}</text>
    <text x="32" y="704" xml:space="preserve">data: {"type": <tspan fill="#e5825a">"item_start"</tspan>, "item_id": "call_YTYZ1F&#8230;", "kind": <tspan fill="#6fa8dc">"fileChange"</tspan>,</text>
    <text x="32" y="732" xml:space="preserve">       "detail": {"files": [{"path": "&#8230;/site/index.html", "kind": <tspan fill="#8fb573">"add"</tspan>}]}}</text>
    <text x="32" y="760" xml:space="preserve"></text>
    <text x="32" y="788" xml:space="preserve"><tspan fill="#756d62"># 19 items and 54.9 seconds later, the receipt:</tspan></text>
    <text x="32" y="816" xml:space="preserve">data: {"type": <tspan fill="#8fb573">"complete"</tspan>, "status": <tspan fill="#8fb573">"completed"</tspan>, "duration_ms": <tspan fill="#e5825a">54875</tspan>,</text>
    <text x="32" y="844" xml:space="preserve">       "usage": {"totalTokens": <tspan fill="#e5825a">159680</tspan>, "inputTokens": <tspan fill="#e5825a">151319</tspan>,</text>
    <text x="32" y="872" xml:space="preserve">                 "cachedInputTokens": <tspan fill="#e5825a">129280</tspan>, "outputTokens": <tspan fill="#e5825a">8361</tspan>, &#8230;}}</text>
  </g>
</svg>