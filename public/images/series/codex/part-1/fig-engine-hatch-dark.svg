<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660">
  <rect width="1240" height="660" fill="#151311"/>
  <text x="60" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#756d62">ONE ENGINE &#183; MANY CLIENTS &#183; SAME NOTES UNDER THE SAME DOOR</text>

  <!-- the engine -->
  <rect x="60" y="104" width="420" height="380" rx="16" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/>
  <text x="86" y="144" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" fill="#756d62">THE ENGINE</text>
  <text x="86" y="186" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="25" font-weight="700" fill="#ebe7df">codex app-server</text>
  <text x="86" y="216" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#a49c90">one process, spoken to over stdin and stdout</text>
  
  <rect x="86" y="246" width="175" height="34" rx="8" fill="#1d1a17" stroke="#2b2723"/>
  <text x="173.5" y="268" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#a49c90" text-anchor="middle">threads &amp; turns</text>
  
  <rect x="279" y="246" width="175" height="34" rx="8" fill="#1d1a17" stroke="#2b2723"/>
  <text x="366.5" y="268" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#a49c90" text-anchor="middle">the agent loop</text>
  
  <rect x="86" y="292" width="175" height="34" rx="8" fill="#1d1a17" stroke="#2b2723"/>
  <text x="173.5" y="314" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#a49c90" text-anchor="middle">OS sandbox</text>
  
  <rect x="279" y="292" width="175" height="34" rx="8" fill="#1d1a17" stroke="#2b2723"/>
  <text x="366.5" y="314" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#a49c90" text-anchor="middle">rollout archive</text>
  
  <rect x="86" y="338" width="175" height="34" rx="8" fill="#1d1a17" stroke="#2b2723"/>
  <text x="173.5" y="360" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#a49c90" text-anchor="middle">model access</text>
  
  <rect x="279" y="338" width="175" height="34" rx="8" fill="#1d1a17" stroke="#2b2723"/>
  <text x="366.5" y="360" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#a49c90" text-anchor="middle">approvals</text>
  <text x="86" y="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a49c90">Everything a Codex surface can do</text>
  <text x="86" y="442" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a49c90">lives here, behind one JSON-RPC door.</text>

  <!-- the door -->
  <line x1="566" y1="94" x2="566" y2="494" stroke="#756d62" stroke-width="2"/>
  
  <rect x="563" y="142" width="6" height="18" rx="3" fill="#151311" stroke="#756d62" stroke-width="1.5"/>
  <rect x="563" y="214" width="6" height="18" rx="3" fill="#151311" stroke="#756d62" stroke-width="1.5"/>
  <rect x="563" y="286" width="6" height="18" rx="3" fill="#151311" stroke="#756d62" stroke-width="1.5"/>
  <rect x="563" y="358" width="6" height="18" rx="3" fill="#151311" stroke="#756d62" stroke-width="1.5"/>
  <rect x="563" y="430" width="6" height="18" rx="3" fill="#151311" stroke="#e5825a" stroke-width="1.5"/>
  
  <line x1="480" y1="151" x2="660" y2="151" stroke="#2b2723" stroke-width="1.5"/>
  <line x1="480" y1="223" x2="660" y2="223" stroke="#2b2723" stroke-width="1.5"/>
  <line x1="480" y1="295" x2="660" y2="295" stroke="#2b2723" stroke-width="1.5"/>
  <line x1="480" y1="367" x2="660" y2="367" stroke="#2b2723" stroke-width="1.5"/>
  <line x1="480" y1="439" x2="660" y2="439" stroke="#e5825a" stroke-width="2.5"/>
  
  <rect x="660" y="122" width="520" height="58" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/>
  <text x="680" y="147" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ebe7df">Codex CLI</text>
  <text x="680" y="167" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a49c90">the terminal app you ran during setup</text>
  <rect x="660" y="194" width="520" height="58" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/>
  <text x="680" y="219" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ebe7df">IDE extension</text>
  <text x="680" y="239" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a49c90">the Codex panel inside VS Code</text>
  <rect x="660" y="266" width="520" height="58" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/>
  <text x="680" y="291" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ebe7df">Codex web</text>
  <text x="680" y="311" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a49c90">chatgpt.com/codex, cloud tasks</text>
  <rect x="660" y="338" width="520" height="58" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/>
  <text x="680" y="363" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ebe7df">Codex desktop app</text>
  <text x="680" y="383" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a49c90">same engine, native window</text>
  <rect x="660" y="410" width="520" height="58" rx="12" fill="#2a201a" stroke="#5e463a" stroke-width="1.5"/>
  <text x="680" y="435" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e5825a">Your app: Pagewright</text>
  <text x="680" y="455" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a49c90">starting today, about 60 lines of Python</text>
  <text x="566" y="526" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#756d62" text-anchor="middle">STDIO &#183; JSON, ONE LINE PER NOTE</text>

  <!-- legend: the two kinds of note -->
  <rect x="60" y="564" width="470" height="58" rx="10" fill="#1d1a17" stroke="#2b2723"/>
  <text x="80" y="588" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#e5825a">{"id": 3, "method": "turn/start", &#8230;}</text>
  <text x="80" y="610" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a49c90">a request: numbered, gets exactly one reply</text>
  <rect x="556" y="564" width="470" height="58" rx="10" fill="#1d1a17" stroke="#2b2723"/>
  <text x="576" y="588" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a49c90">{"method": "item/started", &#8230;}</text>
  <text x="576" y="610" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#a49c90">a notification: no number, arrives unasked</text>
</svg>