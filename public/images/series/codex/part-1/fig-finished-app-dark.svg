<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600">
  <rect width="1280" height="600" fill="#151311"/>

  <!-- browser window -->
  <rect x="40" y="20" width="1200" height="560" rx="12" fill="#1d1a17" stroke="#2b2723" stroke-width="1.5"/>
  <path d="M 40 32 a12 12 0 0 1 12,-12 h 1176 a12 12 0 0 1 12,12 v 32 h -1200 z" fill="#211e1a"/>
  <line x1="40" y1="64" x2="1240" y2="64" stroke="#2b2723" stroke-width="1.5"/>
  <circle cx="66" cy="42" r="6" fill="#3a3530"/><circle cx="88" cy="42" r="6" fill="#3a3530"/><circle cx="110" cy="42" r="6" fill="#3a3530"/>
  <rect x="450" y="28" width="380" height="28" rx="14" fill="#211e1a" stroke="#2b2723"/>
  <text x="640" y="47" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a49c90" text-anchor="middle">localhost:3000</text>

  <!-- chat column -->
  <rect x="64" y="104" width="442" height="452" rx="12" fill="#211e1a" stroke="#2f2a25" stroke-width="1.5"/>
  <text x="86" y="136" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ebe7df">Pagewright</text>
  <text x="484" y="136" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="end">BEANLINE &#183; BUILDING&#8230; 31s</text>
  <line x1="64" y1="152" x2="506" y2="152" stroke="#2f2a25" stroke-width="1.5"/>

  <!-- user bubble -->
  <rect x="160" y="168" width="324" height="56" rx="12" fill="#3a332c"/>
  <text x="176" y="191" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#fafaf9">A one-page site for Beanline: warm,</text>
  <text x="176" y="211" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#fafaf9">editorial, a menu section.</text>

  <!-- command badge, done -->
  <rect x="86" y="240" width="316" height="34" rx="9" fill="none" stroke="#2f2a25" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="100" y="262" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#a49c90"><tspan fill="#a3c57d">&#10003;</tspan>  <tspan font-weight="700" fill="#ebe7df">zsh</tspan>  rg --files &#183; exit 0</text>

  <!-- file change badge, running -->
  <rect x="86" y="282" width="316" height="34" rx="9" fill="none" stroke="#2f2a25" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="100" y="304" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#a49c90"><tspan fill="#e5825a">&#9679;</tspan>  <tspan font-weight="700" fill="#ebe7df">edit</tspan>  index.html &#183; updating</text>

  <!-- approval card with patch preview -->
  <rect x="86" y="330" width="398" height="150" rx="12" fill="#2a201a" stroke="#5e463a" stroke-width="1.5"/>
  <text x="104" y="356" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ebe7df">Approve this patch?</text>
  <text x="466" y="356" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#e5825a" text-anchor="end">+9 &#8722;2</text>
  <rect x="104" y="368" width="362" height="66" rx="8" fill="#1a1816"/>
  <text x="118" y="389" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62">@@ index.html</text>
  <text x="118" y="407" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8fb573">+ &lt;section id="menu"&gt;</text>
  <text x="118" y="425" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d97676">&#8722; &lt;p&gt;menu coming soon&lt;/p&gt;</text>
  <rect x="104" y="444" width="92" height="26" rx="13" fill="#ebe7df"/>
  <text x="150" y="461" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1c1917" text-anchor="middle">Approve</text>
  <rect x="206" y="444" width="72" height="26" rx="13" fill="none" stroke="#5e463a" stroke-width="1.5"/>
  <text x="242" y="461" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#ebe7df" text-anchor="middle">Deny</text>

  <!-- streaming line -->
  <text x="86" y="514" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#a49c90">Adding the menu section now, then the</text>
  <text x="86" y="534" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#a49c90">footer.<tspan fill="#e5825a">&#9612;</tspan></text>

  <!-- preview pane -->
  <rect x="526" y="104" width="618" height="452" rx="12" fill="#211e1a" stroke="#2f2a25" stroke-width="1.5"/>
  <text x="548" y="136" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#e5825a">LIVE PREVIEW</text>
  <text x="1066" y="136" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="end">/p/beanline/</text>
  <line x1="526" y1="152" x2="1144" y2="152" stroke="#2f2a25" stroke-width="1.5"/>

  <!-- the generated Beanline page -->
  <rect x="544" y="168" width="526" height="370" rx="8" fill="#241b14" stroke="#3b2f24"/>
  <text x="578" y="236" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#efe3d5">Beanline</text>
  <text x="578" y="266" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-style="italic" fill="#b09a88">Slow coffee, roasted loud.</text>
  <line x1="578" y1="288" x2="656" y2="288" stroke="#d99b62" stroke-width="2.5"/>
  <text x="578" y="326" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="2.5" fill="#d99b62">THE MENU</text>
  
  <rect x="578" y="342" width="176" height="52" rx="8" fill="#2c221a" stroke="#3b2f24"/>
  <text x="592" y="364" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#efe3d5">Espresso</text>
  <text x="592" y="383" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d99b62">3.20</text>
  
  <rect x="770" y="342" width="176" height="52" rx="8" fill="#2c221a" stroke="#3b2f24"/>
  <text x="784" y="364" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#efe3d5">Flat white</text>
  <text x="784" y="383" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d99b62">4.10</text>
  
  <rect x="578" y="406" width="176" height="52" rx="8" fill="#2c221a" stroke="#3b2f24"/>
  <text x="592" y="428" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#efe3d5">Filter of the day</text>
  <text x="592" y="447" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d99b62">3.60</text>
  
  <rect x="770" y="406" width="176" height="52" rx="8" fill="#2c221a" stroke="#3b2f24"/>
  <text x="784" y="428" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#efe3d5">Cardamom bun</text>
  <text x="784" y="447" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d99b62">3.90</text>
  <text x="578" y="514" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#b09a88">Roastery &amp; cafe &#183; Marine Drive &#183; open 7 to 7</text>

  <!-- diff drawer peeking from the right -->
  <path d="M 1086 118 h 46 a12 12 0 0 1 12 12 v 400 a12 12 0 0 1 -12 12 h -46 z" fill="#1a1816"/>
  <text x="1100" y="144" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" letter-spacing="2" fill="#e5825a">DIFF</text>
  <text x="1098" y="170" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#8fb573">+ &lt;se</text>
  <text x="1098" y="188" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#8fb573">+ &lt;h2</text>
  <text x="1098" y="206" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#d97676">&#8722; &lt;p&gt;</text>
  <text x="1098" y="224" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#8fb573">+ &lt;ul</text>
  <text x="1098" y="242" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#756d62">&#8230;</text>
</svg>