<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1991" viewBox="0 0 1240 1991">
  <rect width="1240" height="1991" fill="#151311"/>
  <text x="60" y="42" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#756d62">ONE REAL TURN ON THE WIRE &#183; BEANLINE BUILD, 2026-07-06, TRIMMED</text>
  <rect x="60" y="64" width="764" height="194" rx="14" fill="#211e1a" stroke="#5e463a" stroke-width="1.5"/>
  <text x="86" y="102" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#ebe7df">you &#8594; engine</text>
  <text x="798" y="102" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#e5825a" text-anchor="end">REQUEST &#183; HAS AN ID</text>
  <line x1="60" y1="114" x2="824" y2="114" stroke="#2b2723" stroke-width="1"/>
  <text x="86" y="130" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#e5825a" xml:space="preserve">{"jsonrpc": "2.0", "id": 3, "method": "turn/start",</text>
  <text x="86" y="159" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#ebe7df" xml:space="preserve"> "params": {"threadId": "019f387d-a6b4-&#8230;",</text>
  <text x="86" y="188" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#ebe7df" xml:space="preserve">   "input": [{"type": "text",</text>
  <text x="86" y="217" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#a49c90" xml:space="preserve">     "text": "Build a single-page site for Beanline&#8230;"}]}}</text>
  <line x1="832" y1="99" x2="854" y2="99" stroke="#e5825a" stroke-width="1.5"/><text x="864" y="104" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e5825a">A numbered note.</text><text x="864" y="130" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">Exactly one reply will</text><text x="864" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">quote id 3. Everything</text><text x="864" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">else you get back is</text><text x="864" y="208" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">narration.</text>
  <line x1="120" y1="266" x2="120" y2="298" stroke="#756d62" stroke-width="2"/>
  <path d="M 113 296 L 127 296 L 120 308 Z" fill="#756d62"/>
  
  <rect x="60" y="316" width="764" height="165" rx="14" fill="#211e1a" stroke="#5e463a" stroke-width="1.5"/>
  <text x="86" y="354" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#ebe7df">engine &#8594; you</text>
  <text x="798" y="354" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#e5825a" text-anchor="end">RESPONSE &#183; SAME ID</text>
  <line x1="60" y1="366" x2="824" y2="366" stroke="#2b2723" stroke-width="1"/>
  <text x="86" y="382" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#e5825a" xml:space="preserve">{"id": 3, "result": {"turn": {</text>
  <text x="86" y="411" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#ebe7df" xml:space="preserve">   "id": "019f387d-a71a-7641-&#8230;",</text>
  <text x="86" y="440" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#ebe7df" xml:space="preserve">   "status": "inProgress", &#8230;}}}</text>
  <line x1="832" y1="351" x2="854" y2="351" stroke="#e5825a" stroke-width="1.5"/><text x="864" y="356" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e5825a">The receipt, not the result.</text><text x="864" y="382" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">The turn is accepted and</text><text x="864" y="408" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">running. The actual work</text><text x="864" y="434" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">arrives below, unnumbered.</text>
  <line x1="120" y1="489" x2="120" y2="521" stroke="#756d62" stroke-width="2"/>
  <path d="M 113 519 L 127 519 L 120 531 Z" fill="#756d62"/>
  <text x="144" y="515" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#756d62">the narration begins &#183; nothing below carries an id</text>
  <rect x="60" y="539" width="764" height="194" rx="14" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/>
  <text x="86" y="577" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#ebe7df">item/started</text>
  <text x="798" y="577" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#756d62" text-anchor="end">NOTIFICATION</text>
  <line x1="60" y1="589" x2="824" y2="589" stroke="#2b2723" stroke-width="1"/>
  <text x="86" y="605" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#ebe7df" xml:space="preserve">{"method": "item/started", "params": {"item": {</text>
  <text x="86" y="634" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#e5825a" xml:space="preserve">   "type": "commandExecution", "id": "call_TQqOM&#8230;",</text>
  <text x="86" y="663" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#ebe7df" xml:space="preserve">   "command": "/bin/zsh -lc 'rg --files'",</text>
  <text x="86" y="692" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#a49c90" xml:space="preserve">   "status": "inProgress", &#8230;}, "turnId": &#8230;}}</text>
  <line x1="832" y1="574" x2="854" y2="574" stroke="#e5825a" stroke-width="1.5"/><text x="864" y="579" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e5825a">An item opens.</text><text x="864" y="605" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">One unit of agent work:</text><text x="864" y="631" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">a command, a file edit,</text><text x="864" y="657" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">reasoning, or prose. Each</text><text x="864" y="683" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">gets started/completed.</text>
  <line x1="120" y1="741" x2="120" y2="773" stroke="#756d62" stroke-width="2"/>
  <path d="M 113 771 L 127 771 L 120 783 Z" fill="#756d62"/>
  
  <rect x="60" y="791" width="764" height="136" rx="14" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/>
  <text x="86" y="829" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#ebe7df">item/agentMessage/delta</text>
  <text x="798" y="829" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#756d62" text-anchor="end">NOTIFICATION &#183; &#215; 248</text>
  <line x1="60" y1="841" x2="824" y2="841" stroke="#2b2723" stroke-width="1"/>
  <text x="86" y="857" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#ebe7df" xml:space="preserve">{"method": "item/agentMessage/delta", "params": {</text>
  <text x="86" y="886" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#e5825a" xml:space="preserve">   "itemId": "msg_0925e1fe48f0&#8230;", "delta": "I"}}</text>
  <line x1="832" y1="826" x2="854" y2="826" stroke="#e5825a" stroke-width="1.5"/><text x="864" y="831" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e5825a">The typing effect.</text><text x="864" y="857" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">Hundreds of these, a few</text><text x="864" y="883" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">characters each, keyed to</text><text x="864" y="909" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">their item by itemId.</text>
  <line x1="120" y1="935" x2="120" y2="967" stroke="#756d62" stroke-width="2"/>
  <path d="M 113 965 L 127 965 L 120 977 Z" fill="#756d62"/>
  
  <rect x="60" y="985" width="764" height="194" rx="14" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/>
  <text x="86" y="1023" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#ebe7df">item/completed</text>
  <text x="798" y="1023" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#756d62" text-anchor="end">NOTIFICATION</text>
  <line x1="60" y1="1035" x2="824" y2="1035" stroke="#2b2723" stroke-width="1"/>
  <text x="86" y="1051" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#ebe7df" xml:space="preserve">{"method": "item/completed", "params": {"item": {</text>
  <text x="86" y="1080" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#e5825a" xml:space="preserve">   "type": "fileChange", "changes": [{</text>
  <text x="86" y="1109" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#ebe7df" xml:space="preserve">     "path": "&#8230;/site/index.html",</text>
  <text x="86" y="1138" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#a3c57d" xml:space="preserve">     "kind": {"type": "add"}, "diff": "&#8230;"}], &#8230;}}}</text>
  <line x1="832" y1="1020" x2="854" y2="1020" stroke="#e5825a" stroke-width="1.5"/><text x="864" y="1025" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e5825a">The item settles,</text><text x="864" y="1051" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">results attached. Here:</text><text x="864" y="1077" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">the file the agent added,</text><text x="864" y="1103" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">with its diff.</text>
  <line x1="120" y1="1187" x2="120" y2="1219" stroke="#756d62" stroke-width="2"/>
  <path d="M 113 1217 L 127 1217 L 120 1229 Z" fill="#756d62"/>
  
  <rect x="60" y="1237" width="764" height="223" rx="14" fill="#211e1a" stroke="#5e463a" stroke-width="1.5"/>
  <text x="86" y="1275" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#ebe7df">thread/tokenUsage/updated</text>
  <text x="798" y="1275" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#e5825a" text-anchor="end">NOTIFICATION &#183; THE METER</text>
  <line x1="60" y1="1287" x2="824" y2="1287" stroke="#2b2723" stroke-width="1"/>
  <text x="86" y="1303" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#ebe7df" xml:space="preserve">{"method": "thread/tokenUsage/updated", "params": {</text>
  <text x="86" y="1332" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#e5825a" xml:space="preserve">   "tokenUsage": {"total": {"totalTokens": 125052,</text>
  <text x="86" y="1361" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#e5825a" xml:space="preserve">     "inputTokens": 117968, "cachedInputTokens": 96640,</text>
  <text x="86" y="1390" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#e5825a" xml:space="preserve">     "outputTokens": 7084, &#8230;}, &#8230;},</text>
  <text x="86" y="1419" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#a49c90" xml:space="preserve">   "modelContextWindow": 258400}}</text>
  <line x1="832" y1="1272" x2="854" y2="1272" stroke="#e5825a" stroke-width="1.5"/><text x="864" y="1277" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e5825a">The only place usage</text><text x="864" y="1303" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e5825a">lives.</text><text x="864" y="1329" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">Fires several times per</text><text x="864" y="1355" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">turn; the last one is</text><text x="864" y="1381" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">your bill.</text>
  <line x1="120" y1="1468" x2="120" y2="1500" stroke="#756d62" stroke-width="2"/>
  <path d="M 113 1498 L 127 1498 L 120 1510 Z" fill="#756d62"/>
  
  <rect x="60" y="1518" width="764" height="165" rx="14" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/>
  <text x="86" y="1556" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#ebe7df">turn/diff/updated</text>
  <text x="798" y="1556" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#756d62" text-anchor="end">NOTIFICATION</text>
  <line x1="60" y1="1568" x2="824" y2="1568" stroke="#2b2723" stroke-width="1"/>
  <text x="86" y="1584" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#ebe7df" xml:space="preserve">{"method": "turn/diff/updated", "params": {</text>
  <text x="86" y="1613" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#a3c57d" xml:space="preserve">   "diff": "diff --git a/index.html b/index.html\n</text>
  <text x="86" y="1642" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#a3c57d" xml:space="preserve">     new file mode 100644\n&#8230;+&lt;!doctype html&gt;&#8230;"}}</text>
  <line x1="832" y1="1553" x2="854" y2="1553" stroke="#e5825a" stroke-width="1.5"/><text x="864" y="1558" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e5825a">The whole turn's diff,</text><text x="864" y="1584" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">re-sent as it grows.</text><text x="864" y="1610" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">Part 4 turns this into</text><text x="864" y="1636" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">the diff drawer.</text>
  <line x1="120" y1="1691" x2="120" y2="1723" stroke="#756d62" stroke-width="2"/>
  <path d="M 113 1721 L 127 1721 L 120 1733 Z" fill="#756d62"/>
  
  <rect x="60" y="1741" width="764" height="194" rx="14" fill="#211e1a" stroke="#5e463a" stroke-width="1.5"/>
  <text x="86" y="1779" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="18" font-weight="700" fill="#ebe7df">turn/completed</text>
  <text x="798" y="1779" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#e5825a" text-anchor="end">NOTIFICATION &#183; CLOSING BELL</text>
  <line x1="60" y1="1791" x2="824" y2="1791" stroke="#2b2723" stroke-width="1"/>
  <text x="86" y="1807" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#ebe7df" xml:space="preserve">{"method": "turn/completed", "params": {"turn": {</text>
  <text x="86" y="1836" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#ebe7df" xml:space="preserve">   "id": "019f387d-a71a-7641-&#8230;",</text>
  <text x="86" y="1865" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#a3c57d" xml:space="preserve">   "status": "completed",</text>
  <text x="86" y="1894" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#a49c90" xml:space="preserve">   "durationMs": &#8230;, "error": null}}}</text>
  <line x1="832" y1="1776" x2="854" y2="1776" stroke="#e5825a" stroke-width="1.5"/><text x="864" y="1781" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#e5825a">Status and timing only.</text><text x="864" y="1807" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">No usage field here; the</text><text x="864" y="1833" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">meter already told you.</text><text x="864" y="1859" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#a49c90">Our run: completed, 45.0s.</text>
