<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="284" viewBox="0 0 1040 284" font-family="'SF Mono', Menlo, Consolas, monospace">
  <rect width="1040" height="284" fill="#1a1816"/>
  <rect width="1040" height="48" fill="#211e1a"/>
  <circle cx="28" cy="24" r="7" fill="#3a3530"/>
  <circle cx="52" cy="24" r="7" fill="#3a3530"/>
  <circle cx="76" cy="24" r="7" fill="#3a3530"/>
  <text x="520" y="30" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#756d62" text-anchor="middle" letter-spacing="1">terminal &#183; backend</text>
  <g font-size="14.5" fill="#d8d2c6">
    <text x="32" y="88" xml:space="preserve"><tspan fill="#756d62">$</tspan> uv run python skip_handshake.py   <tspan fill="#756d62"># thread/start sent first, no initialize</tspan></text>
    <text x="32" y="116" xml:space="preserve"></text>
    <text x="32" y="144" xml:space="preserve">{"error":{"code":<tspan fill="#d97676">-32600</tspan>,"message":<tspan fill="#d97676">"Not initialized"</tspan>},"id":<tspan fill="#e5825a">1</tspan>}</text>
    <text x="32" y="172" xml:space="preserve"></text>
    <text x="32" y="200" xml:space="preserve"><tspan fill="#756d62"># no crash, no silence: a proper JSON-RPC error, quoting our id.</tspan></text>
    <text x="32" y="228" xml:space="preserve"><tspan fill="#756d62"># the engine refuses every method until the handshake is done.</tspan></text>
  </g>
</svg>