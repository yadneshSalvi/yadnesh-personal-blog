<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img">
  <rect width="1240" height="760" fill="#151311"/>
  <text x="48" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" fill="#756d62">THE GRID COMPLETES &#183; BOTH DIALS WIRED</text>
  <line x1="48" y1="66" x2="1192" y2="66" stroke="#2b2723" stroke-width="1.5"/>
  <text x="730" y="94" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="middle">CONSENT &#183; approvalPolicy &#183; when does a human get asked?</text><text x="430" y="128" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a49c90" text-anchor="middle">untrusted</text><text x="630" y="128" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a49c90" text-anchor="middle">on-failure</text><text x="830" y="128" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#e5825a" text-anchor="middle">on-request</text><text x="1030" y="128" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a49c90" text-anchor="middle">never</text><text x="64" y="350" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="middle" transform="rotate(-90 64 350)">CONTAINMENT &#183; sandboxPolicy &#183; what may commands touch?</text><text x="304" y="196" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a49c90" text-anchor="end">readOnly</text><text x="304" y="216" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="end">look and plan</text><text x="304" y="296" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a49c90" text-anchor="end">workspaceWrite</text><text x="304" y="316" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="end">network off</text><text x="304" y="396" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a49c90" text-anchor="end">workspaceWrite</text><text x="304" y="416" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="end">network on</text><text x="304" y="496" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#e08585" text-anchor="end">dangerFullAccess</text><text x="304" y="516" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="end">no walls</text><rect x="330" y="150" width="200" height="100" fill="none" fill-opacity="0" stroke="#2b2723" stroke-width="1"/><rect x="530" y="150" width="200" height="100" fill="none" fill-opacity="0" stroke="#2b2723" stroke-width="1"/><rect x="730" y="150" width="200" height="100" fill="none" fill-opacity="0" stroke="#2b2723" stroke-width="1"/><rect x="930" y="150" width="200" height="100" fill="none" fill-opacity="0" stroke="#2b2723" stroke-width="1"/><rect x="330" y="250" width="200" height="100" fill="none" fill-opacity="0" stroke="#2b2723" stroke-width="1"/><rect x="530" y="250" width="200" height="100" fill="none" fill-opacity="0" stroke="#2b2723" stroke-width="1"/><rect x="730" y="250" width="200" height="100" fill="none" fill-opacity="0" stroke="#2b2723" stroke-width="1"/><rect x="930" y="250" width="200" height="100" fill="none" fill-opacity="0" stroke="#2b2723" stroke-width="1"/><rect x="330" y="350" width="200" height="100" fill="none" fill-opacity="0" stroke="#2b2723" stroke-width="1"/><rect x="530" y="350" width="200" height="100" fill="none" fill-opacity="0" stroke="#2b2723" stroke-width="1"/><rect x="730" y="350" width="200" height="100" fill="none" fill-opacity="0" stroke="#2b2723" stroke-width="1"/><rect x="930" y="350" width="200" height="100" fill="none" fill-opacity="0" stroke="#2b2723" stroke-width="1"/><rect x="330" y="450" width="200" height="100" fill="#2a1717" fill-opacity="0.45" stroke="#2b2723" stroke-width="1"/><rect x="530" y="450" width="200" height="100" fill="#2a1717" fill-opacity="0.45" stroke="#2b2723" stroke-width="1"/><rect x="730" y="450" width="200" height="100" fill="#2a1717" fill-opacity="0.45" stroke="#2b2723" stroke-width="1"/><rect x="930" y="450" width="200" height="100" fill="#2a1717" fill-opacity="0.45" stroke="#2b2723" stroke-width="1"/><rect x="956" y="178" width="148" height="44" rx="10" fill="#101c24" stroke="#2d4c60" stroke-width="1.5"/>
    <text x="1030" y="199" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="13.5" fill="#6fb3dd" text-anchor="middle">Read-only</text>
    <text x="1030" y="215" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#756d62" text-anchor="middle">in Pagewright</text><rect x="756" y="278" width="148" height="44" rx="10" fill="#2a201a" stroke="#5e463a" stroke-width="1.5"/>
    <text x="830" y="299" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="13.5" fill="#e5825a" text-anchor="middle">Standard</text>
    <text x="830" y="315" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#756d62" text-anchor="middle">in Pagewright</text><rect x="956" y="378" width="148" height="44" rx="10" fill="#26200f" stroke="#6b5426" stroke-width="1.5"/>
    <text x="1030" y="399" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="13.5" fill="#dcae62" text-anchor="middle">Trusted</text>
    <text x="1030" y="415" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#756d62" text-anchor="middle">in Pagewright</text><rect x="956" y="278" width="148" height="44" rx="10" fill="none" stroke="#756d62" stroke-width="1.2" stroke-dasharray="5 4" opacity="0.6"/>
  <text x="1030" y="303" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#756d62" text-anchor="middle">Acts I&#8211;II so far</text>
  <path d="M 952 300 C 920 300, 940 300, 910 300" fill="none" stroke="#e5825a" stroke-width="1.5"/>
  <path d="M 910 300 l 10 -5 l 0 10 z" fill="#e5825a"/><text x="730" y="502" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#e08585" text-anchor="middle">still not offered: no cell in this row exists in the product</text>
  <text x="620" y="642" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#a49c90" text-anchor="middle">Read-only never asks because it never acts. Trusted never asks because the sandbox contains.</text>
  <text x="620" y="666" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#a49c90" text-anchor="middle">Standard asks: on-request lets the agent propose stepping past the bench, and freezes the item on your answer.</text>
  <text x="620" y="698" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#e5825a" text-anchor="middle">Approval is escalation: an accepted command or patch acts OUTSIDE the walls the sandbox drew.</text>
</svg>