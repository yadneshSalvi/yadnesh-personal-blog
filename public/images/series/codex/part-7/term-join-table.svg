<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="508" viewBox="0 0 1040 508" font-family="'SF Mono', Menlo, Consolas, monospace">
  <rect width="1040" height="508" fill="#1a1816"/>
  <rect width="1040" height="48" fill="#211e1a"/>
  <circle cx="28" cy="24" r="7" fill="#3a3530"/>
  <circle cx="52" cy="24" r="7" fill="#3a3530"/>
  <circle cx="76" cy="24" r="7" fill="#3a3530"/>
  <text x="520" y="30" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#756d62" text-anchor="middle" letter-spacing="1">stdio &#183; the fileChange request arrives naked; the patch came first</text>
  <g font-size="14.5" fill="#d8d2c6">
    <text x="32" y="88" xml:space="preserve"><tspan fill="#756d62"># same millisecond, two notes. First, the item opens, CARRYING the patch:</tspan></text>
    <text x="32" y="116" xml:space="preserve"><tspan fill="#756d62">←</tspan> {"method": <tspan fill="#e5825a">"item/started"</tspan>, "params": {"item": {</text>
    <text x="32" y="144" xml:space="preserve">      "type": <tspan fill="#6fa8dc">"fileChange"</tspan>, "id": <tspan fill="#dcae62">"call_U2FCrAls…"</tspan>,</text>
    <text x="32" y="172" xml:space="preserve">      "changes": [{"path": "…/outside/note-from-h.txt",</text>
    <text x="32" y="200" xml:space="preserve">                   "kind": {"type": "add"}, "diff": <tspan fill="#8fb573">"hello from h\n"</tspan>}],</text>
    <text x="32" y="228" xml:space="preserve">      "status": "inProgress"}, …}}</text>
    <text x="32" y="256" xml:space="preserve"></text>
    <text x="32" y="284" xml:space="preserve"><tspan fill="#756d62"># then the question, which names the item and nothing else:</tspan></text>
    <text x="32" y="312" xml:space="preserve"><tspan fill="#756d62">←</tspan> {"id": <tspan fill="#e5825a">0</tspan>, "method": <tspan fill="#e5825a">"item/fileChange/requestApproval"</tspan>, "params": {</text>
    <text x="32" y="340" xml:space="preserve">      "threadId": "019f38e1-…", "turnId": "019f38e1-…",</text>
    <text x="32" y="368" xml:space="preserve">      "itemId": <tspan fill="#dcae62">"call_U2FCrAls…"</tspan>, "startedAtMs": 1783365744977,</text>
    <text x="32" y="396" xml:space="preserve">      "reason": <tspan fill="#d97676">null</tspan>, "grantRoot": <tspan fill="#d97676">null</tspan>}}</text>
    <text x="32" y="424" xml:space="preserve"><tspan fill="#756d62"># no diff. no file list. no availableDecisions. the itemId is the join key:</tspan></text>
    <text x="32" y="452" xml:space="preserve"><tspan fill="#756d62"># the card's diff is item/started's payload, matched by call_U2FCrAls…</tspan></text>
  </g>
</svg>