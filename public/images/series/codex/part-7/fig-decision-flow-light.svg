<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" role="img">
  <rect width="1240" height="900" fill="#faf9f6"/>
  <text x="48" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" fill="#8f887a">THE BRIDGE &#183; ONE QUESTION'S LIFE, BOTH ENDINGS</text>
  <line x1="48" y1="66" x2="1192" y2="66" stroke="#e7e3d9" stroke-width="1.5"/>

  <!-- lane headers -->
  <text x="210" y="104" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#1f1c19" text-anchor="middle">codex app-server</text>
  <text x="210" y="124" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#8f887a" text-anchor="middle">stdio &#183; JSON-RPC</text>
  <text x="620" y="104" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#1f1c19" text-anchor="middle">FastAPI backend</text>
  <text x="620" y="124" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#8f887a" text-anchor="middle">app/approvals.py &#183; the registry</text>
  <text x="1040" y="104" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#1f1c19" text-anchor="middle">the browser</text>
  <text x="1040" y="124" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#8f887a" text-anchor="middle">SSE down &#183; POST back</text>
  <line x1="210" y1="136" x2="210" y2="740" stroke="#e7e3d9" stroke-width="1" stroke-dasharray="3 5"/>
  <line x1="620" y1="136" x2="620" y2="740" stroke="#e7e3d9" stroke-width="1" stroke-dasharray="3 5"/>
  <line x1="1040" y1="136" x2="1040" y2="740" stroke="#e7e3d9" stroke-width="1" stroke-dasharray="3 5"/>

  <!-- 1. request arrives -->
  <line x1="210" y1="170" x2="490" y2="170" stroke="#b3441a" stroke-width="1.5" />
     <path d="M 490 170 l -5 -8 l 10 0 z" fill="#b3441a" transform="rotate(-90 490 170)"/>
  <text x="355" y="158" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#b3441a" text-anchor="middle">requestApproval &#183; id 0 &#183; then silence</text>
  <rect x="490" y="148" width="260" height="68" rx="10" fill="#f6e7df" stroke="#dcb09a" stroke-width="1.5"/>
  <text x="620" y="174" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#1f1c19" text-anchor="middle">handler fires:</text>
  <text x="620" y="196" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#b3441a" text-anchor="middle">a Future parks in the registry</text>

  <!-- 2. SSE event -->
  <line x1="750" y1="182" x2="930" y2="182" stroke="#8f887a" stroke-width="1.5" />
     <path d="M 930 182 l -5 -8 l 10 0 z" fill="#8f887a" transform="rotate(-90 930 182)"/>
  <text x="840" y="170" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="middle">approval_request &#183; SSE</text>
  <rect x="930" y="160" width="220" height="46" rx="10" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/>
  <text x="1040" y="189" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#5b554c" text-anchor="middle">the card renders, amber</text>

  <!-- the pause band -->
  <rect x="120" y="240" width="1000" height="54" rx="10" fill="#fdf3e0" stroke="#e4c27e" stroke-width="1"/>
  <text x="620" y="262" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#92600a" text-anchor="middle">the turn is frozen &#183; the Future is empty &#183; zero events, zero model calls, zero tokens</text>
  <text x="620" y="282" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#92600a" text-anchor="middle">the engine awaits our response; asyncio.wait_for counts toward PAGEWRIGHT_APPROVAL_TIMEOUT</text>

  <!-- ENDING A: the human answers -->
  <text x="90" y="340" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#3f6212" text-anchor="start">ENDING A &#183; SOMEBODY CLICKS</text>
  <rect x="930" y="360" width="220" height="46" rx="10" fill="#f2f7e8" stroke="#e7e3d9" stroke-width="1.5"/>
  <text x="1040" y="389" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#3f6212" text-anchor="middle">Approve clicked</text>
  <line x1="930" y1="383" x2="750" y2="383" stroke="#3f6212" stroke-width="1.5" />
     <path d="M 750 383 l -5 -8 l 10 0 z" fill="#3f6212" transform="rotate(90 750 383)"/>
  <text x="758" y="352" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5b554c" text-anchor="start">POST /approvals/72121c85/decision</text>
  <rect x="490" y="360" width="260" height="46" rx="10" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/>
  <text x="620" y="389" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#1f1c19" text-anchor="middle">resolve() fills the Future</text>
  <line x1="490" y1="383" x2="210" y2="383" stroke="#3f6212" stroke-width="1.5" />
     <path d="M 210 383 l -5 -8 l 10 0 z" fill="#3f6212" transform="rotate(90 210 383)"/>
  <text x="355" y="371" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#3f6212" text-anchor="middle">{"id": 0, "result": {"decision": "accept"}}</text>
  <rect x="60" y="420" width="300" height="46" rx="10" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/>
  <text x="210" y="449" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="middle">serverRequest/resolved &#183; item runs</text>
  <line x1="750" y1="440" x2="930" y2="440" stroke="#8f887a" stroke-width="1.5" />
     <path d="M 930 440 l -5 -8 l 10 0 z" fill="#8f887a" transform="rotate(-90 930 440)"/>
  <text x="805" y="428" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5b554c" text-anchor="middle">approval_resolved &#183; reason: user</text>
  <rect x="930" y="418" width="220" height="46" rx="10" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/>
  <text x="1040" y="447" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#3f6212" text-anchor="middle">"Approved by you &#183; &#8230;"</text>

  <!-- ENDING B: nobody answers -->
  <text x="90" y="540" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#b91c1c" text-anchor="start">ENDING B &#183; NOBODY ANSWERS</text>
  <rect x="490" y="560" width="260" height="68" rx="10" fill="#fbeaea" stroke="#e7e3d9" stroke-width="1.5"/>
  <text x="620" y="586" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#1f1c19" text-anchor="middle">asyncio.wait_for expires:</text>
  <text x="620" y="608" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#b91c1c" text-anchor="middle">decision = "decline", reason = "timeout"</text>
  <line x1="490" y1="594" x2="210" y2="594" stroke="#b91c1c" stroke-width="1.5" />
     <path d="M 210 594 l -5 -8 l 10 0 z" fill="#b91c1c" transform="rotate(90 210 594)"/>
  <text x="355" y="582" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#b91c1c" text-anchor="middle">{"id": 0, "result": {"decision": "decline"}}</text>
  <line x1="750" y1="594" x2="930" y2="594" stroke="#8f887a" stroke-width="1.5" />
     <path d="M 930 594 l -5 -8 l 10 0 z" fill="#8f887a" transform="rotate(-90 930 594)"/>
  <text x="758" y="548" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#5b554c" text-anchor="start">approval_resolved &#183; reason: timeout</text>
  <rect x="930" y="572" width="220" height="46" rx="10" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/>
  <text x="1040" y="596" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#b91c1c" text-anchor="middle">"Denied automatically</text>
  <text x="1040" y="612" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#b91c1c" text-anchor="middle">(nobody answered in time)"</text>
  <rect x="60" y="646" width="300" height="64" rx="10" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/>
  <text x="210" y="672" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="middle">the turn CONTINUES: the agent</text>
  <text x="210" y="692" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="middle">adapts and finishes honestly</text>

  <!-- footer facts -->
  <rect x="48" y="760" width="1144" height="92" rx="10" fill="#f1efe9" stroke="#e7e3d9"/>
  <text x="68" y="788" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start">MEASURED (PAGEWRIGHT_APPROVAL_TIMEOUT=20, real turn): the request arrived, the card sat unanswered,</text>
  <text x="68" y="810" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start">the clock declined it at +20s, and turn/completed still arrived: 25.8s total, status "completed".</text>
  <text x="68" y="834" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#b3441a" text-anchor="start">A declined approval ends a QUESTION, not the turn. Only Stop (turn/interrupt) ends the turn.</text>
</svg>