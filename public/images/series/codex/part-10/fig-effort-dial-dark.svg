  <text x="68" y="672" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49c90" text-anchor="start">Both runs completed the brief: hero, four drinks, six stores, footer. xhigh bought richer sectioning and typography detail,</text>
