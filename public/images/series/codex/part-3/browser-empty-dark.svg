<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1120" height="620" fill="#0c0a09"/>
  <rect x="0" y="0" width="1120" height="56" fill="#211e1a"/>
  <line x1="0" y1="56" x2="1120" y2="56" stroke="#2b2723" stroke-width="1.5"/>
  <circle cx="30" cy="28" r="7" fill="#3a3530"/><circle cx="56" cy="28" r="7" fill="#3a3530"/><circle cx="82" cy="28" r="7" fill="#3a3530"/>
  <rect x="320" y="13" width="480" height="30" rx="15" fill="#1a1816" stroke="#3a3530"/>
  <text x="560" y="33" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a49c90" text-anchor="middle">localhost:3000</text>
  <line x1="0" y1="102" x2="1120" y2="102" stroke="#292524" stroke-width="1"/>
  <circle cx="28" cy="79" r="5" fill="#4fb8b3"/>
  <text x="42" y="84" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e7e5e4">Pagewright</text>
  <text x="1096" y="84" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#78716c" text-anchor="end">the site builder</text>
  <circle cx="560" cy="208" r="6" fill="#4fb8b3"/>
  <text x="560" y="250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#e7e5e4" text-anchor="middle">Describe a website</text>
  <text x="560" y="280" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#78716c" text-anchor="middle">Pagewright plans it, runs the commands, and writes the files.</text>
  <text x="560" y="300" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#78716c" text-anchor="middle">You watch every step happen.</text>
  
  <rect x="315" y="348" width="490" height="38" rx="10" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <text x="560" y="372" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#d6d3d1" text-anchor="middle">Create hello.html with a big heading that says Pagewright lives</text>
  <rect x="322" y="398" width="476" height="38" rx="10" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <text x="560" y="422" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#d6d3d1" text-anchor="middle">Build a one-page site for a small bakery: hero, menu, contact</text>
  <rect x="426.5" y="448" width="267" height="38" rx="10" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <text x="560" y="472" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#d6d3d1" text-anchor="middle">List the files in your workspace</text>
  <line x1="0" y1="544" x2="1120" y2="544" stroke="#292524" stroke-width="1"/>
  <rect x="200" y="562" width="636" height="42" rx="12" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <text x="216" y="588" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#78716c">Describe the site you want&#8230;</text>
  <rect x="846" y="562" width="74" height="42" rx="12" fill="#4fb8b3" opacity="0.45"/>
  <text x="883" y="588" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Send</text>
