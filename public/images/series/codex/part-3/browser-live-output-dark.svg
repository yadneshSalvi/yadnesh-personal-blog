<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="635" viewBox="0 0 1120 635" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1120" height="635" fill="#0c0a09"/>
  <rect x="0" y="0" width="1120" height="56" fill="#211e1a"/>
  <line x1="0" y1="56" x2="1120" y2="56" stroke="#2b2723" stroke-width="1.5"/>
  <circle cx="30" cy="28" r="7" fill="#3a3530"/><circle cx="56" cy="28" r="7" fill="#3a3530"/><circle cx="82" cy="28" r="7" fill="#3a3530"/>
  <rect x="320" y="13" width="480" height="30" rx="15" fill="#1a1816" stroke="#3a3530"/>
  <text x="560" y="33" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a49c90" text-anchor="middle">localhost:3000</text>
  <line x1="0" y1="102" x2="1120" y2="102" stroke="#292524" stroke-width="1"/>
  <circle cx="28" cy="79" r="5" fill="#4fb8b3"/>
  <text x="42" y="84" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e7e5e4">Pagewright</text>
  <text x="1096" y="84" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#78716c" text-anchor="end">the site builder</text>
  
  <rect x="331" y="130" width="589" height="62" rx="18" fill="#f5f5f4"/>
  <text x="348" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1c1917">Run a shell loop that prints a line per second for 5 seconds, then create</text>
  <text x="348" y="178" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1c1917">pulse.html with a heading that says The stream is alive</text>
  <circle cx="204" cy="220" r="3" fill="#292524"/>
  <text x="216" y="224" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#78716c">THINKING</text>
  <path d="M 296 217 l 4.5 5 l 4.5 -5" fill="none" stroke="#78716c" stroke-width="1.6"/>
  
  <text x="200" y="257" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e7e5e4">I'll run the 5-second shell loop first so you can see the live output, then I'll add</text>
  <text x="200" y="281" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e7e5e4">pulse.html with the requested heading.</text>
  <rect x="200" y="304" width="576" height="157" rx="10" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <circle cx="220" cy="323" r="6.5" fill="none" stroke="#292524" stroke-width="2.5"/>
  <path d="M 220 316.5 A 6.5 6.5 0 0 1 226.5 323" fill="none" stroke="#4fb8b3" stroke-width="2.5" stroke-linecap="round"/>
  <text x="236" y="328" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d6d3d1">Running: /bin/zsh -c 'for i in 1 2 3 4 5; do echo "tick $i"; sleep 1;…</text>
  
  <text x="738" y="327" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="end">COMMAND</text>
  <path d="M 750 320 l 5 6 l 5 -6" fill="none" stroke="#78716c" stroke-width="1.8"/>
  <line x1="200" y1="342" x2="776" y2="342" stroke="#292524" stroke-width="1"/>
  <text x="214" y="364" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#78716c">OUTPUT</text>
  <rect x="212" y="372" width="552" height="77" rx="8" fill="#292524"/>
  <text x="226" y="392" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#d6d3d1" xml:space="preserve">tick 2</text>
  <text x="226" y="411" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#d6d3d1" xml:space="preserve">tick 3</text>
  <text x="226" y="430" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#d6d3d1" xml:space="preserve">tick 4</text>
  
  <text x="200" y="494" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e7e5e4">The loop is running; I'm waiting for the remaining ticks to finish before writing the file.</text>
  <circle cx="205" cy="525" r="4.5" fill="#4fb8b3"/>
  <text x="218" y="530" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#78716c">Building&#8230; 9s</text>
  <line x1="0" y1="559" x2="1120" y2="559" stroke="#292524" stroke-width="1"/>
  <rect x="200" y="577" width="636" height="42" rx="12" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <text x="216" y="603" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#78716c">Describe the site you want&#8230;</text>
  <rect x="846" y="577" width="74" height="42" rx="12" fill="none" stroke="#44403c" stroke-width="1.5"/>
  <text x="883" y="603" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#d6d3d1" text-anchor="middle">Stop</text>
</svg>