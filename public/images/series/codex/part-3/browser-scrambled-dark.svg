<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="678" viewBox="0 0 1120 678" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1120" height="678" fill="#0c0a09"/>
  <rect x="0" y="0" width="1120" height="56" fill="#211e1a"/>
  <line x1="0" y1="56" x2="1120" y2="56" stroke="#2b2723" stroke-width="1.5"/>
  <circle cx="30" cy="28" r="7" fill="#3a3530"/><circle cx="56" cy="28" r="7" fill="#3a3530"/><circle cx="82" cy="28" r="7" fill="#3a3530"/>
  <rect x="320" y="13" width="480" height="30" rx="15" fill="#1a1816" stroke="#3a3530"/>
  <text x="560" y="33" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a49c90" text-anchor="middle">localhost:3000</text>
  <line x1="0" y1="102" x2="1120" y2="102" stroke="#292524" stroke-width="1"/>
  <circle cx="28" cy="79" r="5" fill="#4fb8b3"/>
  <text x="42" y="84" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e7e5e4">Pagewright</text>
  <text x="1096" y="84" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#78716c" text-anchor="end">the site builder</text>
  
  <rect x="316" y="130" width="604" height="84" rx="18" fill="#f5f5f4"/>
  <text x="333" y="156" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1c1917">At the same time, in two separate parallel tool calls, run one command that</text>
  <text x="333" y="178" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1c1917">prints tick N once per second for 5 seconds and another that prints tock N</text>
  <text x="333" y="200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1c1917">once per second for 5 seconds. Then reply with one sentence.</text>
  <circle cx="204" cy="242" r="3" fill="#292524"/>
  <text x="216" y="246" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.5" fill="#78716c">THINKING</text>
  <path d="M 296 239 l 4.5 5 l 4.5 -5" fill="none" stroke="#78716c" stroke-width="1.6"/>
  
  <text x="200" y="279" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e7e5e4">I'm running the two one-second loops concurrently now so the outputs overlap in</text>
  <text x="200" y="303" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e7e5e4">time, then I'll return a single-sentence confirmation.</text>
  <rect x="200" y="326" width="576" height="38" rx="10" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <circle cx="220" cy="345" r="6.5" fill="none" stroke="#292524" stroke-width="2.5"/>
  <path d="M 220 338.5 A 6.5 6.5 0 0 1 226.5 345" fill="none" stroke="#4fb8b3" stroke-width="2.5" stroke-linecap="round"/>
  <text x="236" y="350" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d6d3d1">Running: /bin/zsh -c 'for i in 1 2 3 4 5; do echo "tick $i"; sleep 1;…</text>
  
  <text x="738" y="349" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="end">COMMAND</text>
  <path d="M 750 342 l 5 6 l 5 -6" fill="none" stroke="#78716c" stroke-width="1.8"/>
  
  <rect x="200" y="372" width="576" height="138" rx="10" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <circle cx="220" cy="391" r="6.5" fill="none" stroke="#292524" stroke-width="2.5"/>
  <path d="M 220 384.5 A 6.5 6.5 0 0 1 226.5 391" fill="none" stroke="#4fb8b3" stroke-width="2.5" stroke-linecap="round"/>
  <text x="236" y="396" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d6d3d1">Running: /bin/zsh -c 'for i in 1 2 3 4 5; do echo "tock $i"; sleep 1;…</text>
  
  <text x="738" y="395" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="end">COMMAND</text>
  <path d="M 750 388 l 5 6 l 5 -6" fill="none" stroke="#78716c" stroke-width="1.8"/>
  <line x1="200" y1="410" x2="776" y2="410" stroke="#292524" stroke-width="1"/>
  <text x="214" y="432" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#78716c">OUTPUT</text>
  <rect x="212" y="440" width="552" height="58" rx="8" fill="#292524"/>
  <text x="226" y="460" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#d6d3d1" xml:space="preserve">tick 2</text>
  <text x="226" y="479" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#d6d3d1" xml:space="preserve">tock 2</text>
  
  <text x="200" y="543" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e7e5e4">The tick and tock loops both ran in parallel for 5 seconds and completed successfully.</text>
  <text x="200" y="574" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#78716c">45,705 tokens · 12s</text>
  <line x1="0" y1="602" x2="1120" y2="602" stroke="#292524" stroke-width="1"/>
  <rect x="200" y="620" width="636" height="42" rx="12" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <text x="216" y="646" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#78716c">Describe the site you want&#8230;</text>
  <rect x="846" y="620" width="74" height="42" rx="12" fill="#4fb8b3" opacity="0.45"/>
  <text x="883" y="646" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Send</text>
</svg>