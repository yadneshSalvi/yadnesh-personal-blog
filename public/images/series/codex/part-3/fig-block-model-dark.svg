  <text x="488" y="228" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49c90" xml:space="preserve">done: true}</text><rect x="472" y="250" width="324" height="74" rx="10" fill="#1d1a17" stroke="#2b2723" stroke-width="1.5"/>
