  <text x="80" y="646" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ebe7df">The middle column mirrors the protocol's own noun: an assistant turn is a sequence of <tspan font-weight="700">items</tspan>. The from-zero derivation of this model lives in Agent SDK Part 3.</text>
