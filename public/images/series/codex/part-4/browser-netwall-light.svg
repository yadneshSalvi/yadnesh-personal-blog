  <text x="638" y="206" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="700" fill="#2b2b2b">Beanline</text>
  <text x="604" y="254" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" letter-spacing="3" fill="rgba(43,43,43,0.72)">SPECIALTY COFFEE, SIX STORES, ESTABLISHED 2019</text>
  <text x="604" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#2b2b2b">Slow coffee</text>
  <text x="604" y="346" font-family="Georgia, 'Times New Roman', serif" font-size="40" fill="#2b2b2b">for fast mornings</text>
  <text x="604" y="382" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="rgba(43,43,43,0.72)">Beanline makes coffee, taken seriously. Warm service, careful brewing,</text>
  <text x="604" y="402" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="rgba(43,43,43,0.72)">and a counter built for people who want the day to start with attention.</text>
