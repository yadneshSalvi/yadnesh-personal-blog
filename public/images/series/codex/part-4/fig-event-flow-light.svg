<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780">
  <defs><marker id="arrp4b-light" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#b3441a"/></marker></defs>
  <rect width="1240" height="780" fill="#faf9f6"/>
  <text x="60" y="44" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#8f887a">THREE SIGNALS, THREE FEATURES · REAL PAYLOADS FROM THE BEANLINE RUNS</text>
  <text x="64" y="86" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2" fill="#8f887a">THE PROTOCOL SAYS</text>
  <text x="484" y="86" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2" fill="#8f887a">THE ENVELOPE CARRIES</text>
  <text x="884" y="86" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" letter-spacing="2" fill="#8f887a">THE UI DOES</text>
  <rect x="60" y="110" width="380" height="128" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/>
  <text x="78" y="137" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#1f1c19">item/started + item/completed</text>
  <text x="78" y="160" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">item: {type: "fileChange",</text>
  <text x="78" y="180" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">  changes: [{path: "/abs/.../site/</text>
  <text x="78" y="200" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">    index.html", kind: {type: "add"}}]}</text>
  <text x="78" y="220" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">paths arrive ABSOLUTE</text><rect x="480" y="110" width="360" height="128" rx="12" fill="#ffffff" stroke="#dcb09a" stroke-width="1.5"/>
  <text x="498" y="137" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#b3441a">file_change + preview_refresh</text>
  <text x="498" y="160" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">{"type": "file_change", "files":</text>
  <text x="498" y="180" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">  [{"path": "index.html",</text>
  <text x="498" y="200" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">    "kind": "add"}], "status": "done"}</text>
  <text x="498" y="220" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">then {"type": "preview_refresh"}</text><rect x="880" y="110" width="300" height="128" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/>
  <text x="898" y="137" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#1f1c19">The tree + the glass</text>
  <text x="898" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" xml:space="preserve">file tree refetches /files;</text>
  <text x="898" y="180" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" xml:space="preserve">badge: added / updated / deleted</text>
  <text x="898" y="200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" xml:space="preserve">iframe reloads: ?v=N+1</text>
  <text x="898" y="220" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" xml:space="preserve">(the cache-buster)</text><path d="M 440 174 C 486 174, 434 174, 480 174" fill="none" stroke="#b3441a" stroke-width="2.2"  marker-end="url(#arrp4b-light)"/><path d="M 840 174 C 886 174, 834 174, 880 174" fill="none" stroke="#b3441a" stroke-width="2.2"  marker-end="url(#arrp4b-light)"/><rect x="60" y="292" width="380" height="128" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/>
  <text x="78" y="319" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#1f1c19">turn/diff/updated</text>
  <text x="78" y="342" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">the turn's AGGREGATE unified diff,</text>
  <text x="78" y="362" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">re-sent in full after every change;</text>
  <text x="78" y="382" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">paths are git-repo-relative:</text>
  <text x="78" y="402" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">a/part-04-.../site/index.html</text><rect x="480" y="292" width="360" height="128" rx="12" fill="#ffffff" stroke="#dcb09a" stroke-width="1.5"/>
  <text x="498" y="319" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#b3441a">diff_updated</text>
  <text x="498" y="342" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">{"type": "diff_updated",</text>
  <text x="498" y="362" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve"> "unified_diff": "diff --git</text>
  <text x="498" y="382" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">   a/index.html b/index.html\n..."}</text>
  <text x="498" y="402" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">backend strips the prefix first</text><rect x="880" y="292" width="300" height="128" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/>
  <text x="898" y="319" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#1f1c19">The diff drawer</text>
  <text x="898" y="342" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" xml:space="preserve">drawer re-renders the whole diff;</text>
  <text x="898" y="362" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" xml:space="preserve">the Diff button's dot lights up;</text>
  <text x="898" y="382" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" xml:space="preserve">60 lines of renderer, zero deps</text><path d="M 440 356 C 486 356, 434 356, 480 356" fill="none" stroke="#b3441a" stroke-width="2.2"  marker-end="url(#arrp4b-light)"/><path d="M 840 356 C 886 356, 834 356, 880 356" fill="none" stroke="#b3441a" stroke-width="2.2"  marker-end="url(#arrp4b-light)"/><rect x="60" y="474" width="380" height="128" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/>
  <text x="78" y="501" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#1f1c19">turn/completed</text>
  <text x="78" y="524" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">turn: {status: "completed",</text>
  <text x="78" y="544" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">  durationMs: 44055}</text>
  <text x="78" y="564" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">shell side effects (cp, rm, mkdir)</text>
  <text x="78" y="584" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">emitted NO fileChange item</text><rect x="480" y="474" width="360" height="128" rx="12" fill="#ffffff" stroke="#dcb09a" stroke-width="1.5"/>
  <text x="498" y="501" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#b3441a">complete</text>
  <text x="498" y="524" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">{"type": "complete",</text>
  <text x="498" y="544" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve"> "status": "completed",</text>
  <text x="498" y="564" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve"> "usage": {"totalTokens": 115757}}</text>
  <text x="498" y="584" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" xml:space="preserve">one event, unchanged since Part 2</text><rect x="880" y="474" width="300" height="128" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/>
  <text x="898" y="501" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" font-weight="700" fill="#1f1c19">The catch-all sweep</text>
  <text x="898" y="524" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" xml:space="preserve">on complete, the UI refetches the</text>
  <text x="898" y="544" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" xml:space="preserve">tree AND bumps ?v= once more:</text>
  <text x="898" y="564" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" xml:space="preserve">whatever cp did, the desk shows it</text><path d="M 440 538 C 486 538, 434 538, 480 538" fill="none" stroke="#b3441a" stroke-width="2.2"  marker-end="url(#arrp4b-light)"/><path d="M 840 538 C 886 538, 834 538, 880 538" fill="none" stroke="#b3441a" stroke-width="2.2"  marker-end="url(#arrp4b-light)"/>
  <rect x="60" y="648" width="1120" height="76" rx="10" fill="#eef2e3" stroke="#e7e3d9"/>
  <text x="82" y="678" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f1c19">The vocabulary grows by three (<tspan font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5">file_change</tspan>, <tspan font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5">diff_updated</tspan>, <tspan font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5">preview_refresh</tspan>) and changes nothing that exists.</text>
  <text x="82" y="702" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f1c19">Part 2's curl still works against this backend, and Part 3's badges still render fileChange items. No client broke.</text>
</svg>