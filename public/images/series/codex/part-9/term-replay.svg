<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="564" viewBox="0 0 1040 564" font-family="'SF Mono', Menlo, Consolas, monospace">
  <rect width="1040" height="564" fill="#1a1816"/>
  <rect width="1040" height="48" fill="#211e1a"/>
  <circle cx="28" cy="24" r="7" fill="#3a3530"/>
  <circle cx="52" cy="24" r="7" fill="#3a3530"/>
  <circle cx="76" cy="24" r="7" fill="#3a3530"/>
  <text x="520" y="30" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#756d62" text-anchor="middle" letter-spacing="1">curl -N &#183; the log, replayed on demand (project aa1b16f7)</text>
  <g font-size="14.5" fill="#d8d2c6">
    <text x="32" y="88" xml:space="preserve"><tspan fill="#8fb573">$</tspan> curl -sN localhost:8000/projects/aa1b16f7/stream <tspan fill="#756d62"># a fresh viewer: no bookmark</tspan></text>
    <text x="32" y="116" xml:space="preserve">id: <tspan fill="#e5825a">1</tspan></text>
    <text x="32" y="144" xml:space="preserve">data: {"type": <tspan fill="#e5825a">"session_start"</tspan>, "message": "Build a tiny one-page site for a</text>
    <text x="32" y="172" xml:space="preserve">       lemonade stand called Sunny Sips&#8230;", "turn_id": "019f4543-e61d&#8230;", &#8230;}</text>
    <text x="32" y="200" xml:space="preserve"><tspan fill="#756d62">&#8942; 687 more frames, every one wearing its seq as the SSE id: &#8230;</tspan></text>
    <text x="32" y="228" xml:space="preserve">id: <tspan fill="#e5825a">689</tspan></text>
    <text x="32" y="256" xml:space="preserve">data: {"type": <tspan fill="#e5825a">"complete"</tspan>, "status": "completed", "usage": {"totalTokens": <tspan fill="#dcae62">83034</tspan>, &#8230;}}</text>
    <text x="32" y="284" xml:space="preserve">data: {"type": <tspan fill="#6fa8dc">"caught_up"</tspan>, "last_seq": 689}   <tspan fill="#756d62"># the seam. Note: NO id line</tspan></text>
    <text x="32" y="312" xml:space="preserve"></text>
    <text x="32" y="340" xml:space="preserve"><tspan fill="#756d62"># a tab that died at 685 asks for what it missed: the browser sends this header itself</tspan></text>
    <text x="32" y="368" xml:space="preserve"><tspan fill="#8fb573">$</tspan> curl -sN -H <tspan fill="#dcae62">"Last-Event-ID: 685"</tspan> localhost:8000/projects/aa1b16f7/stream</text>
    <text x="32" y="396" xml:space="preserve">id: <tspan fill="#e5825a">686</tspan>   <tspan fill="#756d62">&#8230;</tspan>   id: <tspan fill="#e5825a">687</tspan>   <tspan fill="#756d62">&#8230;</tspan>   id: <tspan fill="#e5825a">688</tspan>   <tspan fill="#756d62">&#8230;</tspan>   id: <tspan fill="#e5825a">689</tspan>   <tspan fill="#756d62"># exactly four rows, then:</tspan></text>
    <text x="32" y="424" xml:space="preserve">data: {"type": <tspan fill="#6fa8dc">"caught_up"</tspan>, "last_seq": 689}</text>
    <text x="32" y="452" xml:space="preserve"></text>
    <text x="32" y="480" xml:space="preserve"><tspan fill="#756d62"># and mid-turn it is the same sentence: a viewer that died at 730 reconnected and got</tspan></text>
    <text x="32" y="508" xml:space="preserve">id: <tspan fill="#e5825a">731</tspan>  <tspan fill="#756d62">first, then followed the live doorbell all the way to the receipt at id: 925.</tspan></text>
  </g>
</svg>