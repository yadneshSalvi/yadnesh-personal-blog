  <text x="260" y="357" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e7e5e4">before launch</text><text x="260" y="368" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#d6d3d1">assets/logo.svg:2-8 The brief makes `#2F5233` the house</text><text x="260" y="383.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#d6d3d1">color, but the logo asset shown in the hero and footer</text><text x="260" y="399" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#d6d3d1">(`assets/logo.svg`) uses `#1E3A5F` for both the mark and</text><text x="260" y="414.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#d6d3d1">the wordmark, and the client-supplied copy in</text><text x="260" y="430" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#d6d3d1">`brief/assets/logo.svg` matches that blue version. Because</text><text x="260" y="445.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#d6d3d1">the live page ships the blue logo unchanged, the client</text><text x="260" y="461" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#d6d3d1">needs to choose before this goes live.</text><rect x="260" y="478.5" width="118" height="17" rx="4" fill="#292524"/>
