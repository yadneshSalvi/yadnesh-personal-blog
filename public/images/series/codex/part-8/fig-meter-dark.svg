<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="860" viewBox="0 0 1240 860" role="img">
  <rect width="1240" height="860" fill="#151311"/>
  <text x="48" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" fill="#756d62">THE METER &#183; THREE NUMBERS, ONE HONEST RECEIPT</text>
  <line x1="48" y1="66" x2="1192" y2="66" stroke="#2b2723" stroke-width="1.5"/>
  <text x="60" y="106" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">One real turn ("add a one-line footer"), every tokenUsage note it produced, verbatim:</text>

  <rect x="36" y="150" width="262" height="190" rx="12" fill="none" stroke="#756d62" stroke-width="1.2" stroke-dasharray="6 5"/><text x="167" y="180" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="middle">BEFORE THIS TURN</text><text x="167" y="212" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49c90" text-anchor="middle">the thread's odometer</text><text x="167" y="238" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a49c90" text-anchor="middle">reads 215,976</text><text x="167" y="264" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#ebe7df" text-anchor="middle"></text><text x="167" y="290" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="middle">(= first update's</text><text x="167" y="316" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="middle">total &#8722; last)</text>
  <rect x="338" y="150" width="262" height="190" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/><text x="469" y="180" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#e5825a" text-anchor="middle">tokenUsage UPDATE 1</text><text x="469" y="212" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#ebe7df" text-anchor="middle">last: 26,597</text><text x="469" y="238" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#ebe7df" text-anchor="middle">total: 242,573</text><text x="469" y="264" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#ebe7df" text-anchor="middle"></text><text x="469" y="290" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#e5825a" text-anchor="middle">turn = 242,573 &#8722; 215,976</text><text x="469" y="316" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#e5825a" text-anchor="middle">= 26,597</text><line x1="304" y1="245" x2="332" y2="245" stroke="#756d62" stroke-width="1.5"/>
     <path d="M 332 245 l -5 -8 l 10 0 z" fill="#756d62" transform="rotate(-90 332 245)"/>
  <rect x="640" y="150" width="262" height="190" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/><text x="771" y="180" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#e5825a" text-anchor="middle">tokenUsage UPDATE 2</text><text x="771" y="212" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#ebe7df" text-anchor="middle">last: 26,691</text><text x="771" y="238" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#ebe7df" text-anchor="middle">total: 269,264</text><text x="771" y="264" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#ebe7df" text-anchor="middle"></text><text x="771" y="290" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#e5825a" text-anchor="middle">turn = 269,264 &#8722; 215,976</text><text x="771" y="316" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#e5825a" text-anchor="middle">= 53,288</text><line x1="606" y1="245" x2="634" y2="245" stroke="#756d62" stroke-width="1.5"/>
     <path d="M 634 245 l -5 -8 l 10 0 z" fill="#756d62" transform="rotate(-90 634 245)"/>
  <rect x="942" y="150" width="262" height="190" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/><text x="1073" y="180" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#a3c57d" text-anchor="middle">THE RECEIPT (complete)</text><text x="1073" y="212" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a3c57d" text-anchor="middle">"usage": 53,288</text><text x="1073" y="238" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49c90" text-anchor="middle">tokens this turn</text><text x="1073" y="264" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#ebe7df" text-anchor="middle"></text><text x="1073" y="290" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#a49c90" text-anchor="middle">"thread_total":</text><text x="1073" y="316" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a49c90" text-anchor="middle">269,264</text><line x1="908" y1="245" x2="936" y2="245" stroke="#756d62" stroke-width="1.5"/>
     <path d="M 936 245 l -5 -8 l 10 0 z" fill="#756d62" transform="rotate(-90 936 245)"/>

  <text x="620" y="384" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#756d62" text-anchor="middle">242,573 + 26,691 = 269,264 &#183; total grows by exactly last, on every update, in every trace</text>

  <!-- the three definitions -->
  <rect x="32" y="430" width="368" height="210" rx="12" fill="#1d1a17" stroke="#2b2723" stroke-width="1.5"/><text x="56" y="474" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#ebe7df" text-anchor="start">.last</text><text x="376" y="472" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#756d62" text-anchor="end">ONE MODEL REQUEST</text><text x="56" y="514" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">the most recent inference call.</text><text x="56" y="538" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">A build turn makes many of these.</text><text x="56" y="562" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">Bill with it and the receipt shows</text><text x="56" y="586" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">one request's sliver.</text><rect x="436" y="430" width="368" height="210" rx="12" fill="#1d1a17" stroke="#2b2723" stroke-width="1.5"/><text x="460" y="474" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#ebe7df" text-anchor="start">.total</text><text x="780" y="472" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#756d62" text-anchor="end">THE THREAD'S ODOMETER</text><text x="460" y="514" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">lifetime, cumulative, never resets.</text><text x="460" y="538" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">Part 6 watched it hit 1.09M.</text><text x="460" y="562" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">Bill with it and the receipt charges</text><text x="460" y="586" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">the customer for all of history.</text><rect x="840" y="430" width="368" height="210" rx="12" fill="#2a201a" stroke="#5e463a" stroke-width="2"/><text x="864" y="474" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#e5825a" text-anchor="start">turn</text><text x="1184" y="472" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#e5825a" text-anchor="end">COMPUTED &#183; OURS</text><text x="864" y="514" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">total now &#8722; total when the turn</text><text x="864" y="538" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">began. Not on the wire anywhere:</text><text x="864" y="562" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">run_turn computes it. The only</text><text x="864" y="586" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">number that means "this turn".</text>

  <rect x="48" y="730" width="1144" height="82" rx="10" fill="#1d1a17" stroke="#2b2723"/>
  <text x="68" y="760" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49c90" text-anchor="start">Neither wire field means 'this turn'. The baseline falls out of the FIRST update (total &#8722; last), because</text>
  <text x="68" y="782" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49c90" text-anchor="start">that update's last is already part of this turn's spend. Receipt = delta of totals. The gauge's quieter number</text>
  <text x="68" y="804" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#e5825a" text-anchor="start">shows .total under its true name: the thread's lifetime bill, not this turn's.</text>
</svg>