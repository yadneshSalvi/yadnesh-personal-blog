<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" role="img">
  <rect width="1240" height="880" fill="#151311"/>
  <text x="48" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" fill="#756d62">THREE WAYS TO EXTEND THE WORKSHOP &#183; NO PROMPT CHANGES</text>
  <line x1="48" y1="66" x2="1192" y2="66" stroke="#2b2723" stroke-width="1.5"/>
  <line x1="232" y1="100" x2="1008" y2="100" stroke="#756d62" stroke-width="1.5"/>
  <path d="M 1008 100 l -9 -5 l 0 10 z" fill="#756d62"/>
  <text x="620" y="92" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#756d62" text-anchor="middle">ASCENDING COST AND TRUST</text>
  <rect x="48" y="130" width="368" height="560" rx="12" fill="#1d2314" stroke="#2b2723" stroke-width="1.4"/><text x="68" y="164" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a3c57d" text-anchor="start">AGENTS.MD</text><text x="68" y="186" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">the site-rules poster</text><line x1="68" y1="200" x2="396" y2="200" stroke="#2b2723"/><text x="68" y="226" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#756d62" text-anchor="start">LIVES IN</text><text x="68" y="246" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">the workspace itself:</text><text x="68" y="265" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start">site/AGENTS.md, written by</text><text x="68" y="284" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">the project scaffold</text><text x="68" y="315" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#756d62" text-anchor="start">LOADED</text><text x="68" y="335" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">by the engine, on its own,</text><text x="68" y="354" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">from the thread's cwd:</text><text x="68" y="373" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">every turn, zero client code</text><text x="68" y="404" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#756d62" text-anchor="start">THE PROOF</text><text x="68" y="424" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start">thread/start returns</text><text x="68" y="443" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">instructionSources:</text><text x="68" y="462" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start">[".../AGENTS.md"]</text><text x="68" y="481" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start">([] without the file)</text><text x="68" y="512" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#756d62" text-anchor="start">COSTS</text><text x="68" y="532" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">nothing per turn from you;</text><text x="68" y="551" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">always on for this workspace</text><rect x="436" y="130" width="368" height="560" rx="12" fill="#101c24" stroke="#2b2723" stroke-width="1.4"/><text x="456" y="164" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#6fb3dd" text-anchor="start">SKILLS</text><text x="456" y="186" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">the pattern book</text><line x1="456" y1="200" x2="784" y2="200" stroke="#2b2723"/><text x="456" y="226" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#756d62" text-anchor="start">LIVES IN</text><text x="456" y="246" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start">CODEX_HOME/skills/&lt;name&gt;/</text><text x="456" y="265" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">SKILL.md + support files</text><text x="456" y="284" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">(engine-side, not workspace)</text><text x="456" y="315" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#756d62" text-anchor="start">LOADED</text><text x="456" y="335" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">on demand, per turn: a</text><text x="456" y="354" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start">{type: "skill", name, path}</text><text x="456" y="373" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">input item ahead of the text</text><text x="456" y="404" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#756d62" text-anchor="start">THE PROOF</text><text x="456" y="424" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start">skills/list names it and</text><text x="456" y="443" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">hands back the exact path</text><text x="456" y="462" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">the invocation wants</text><text x="456" y="493" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#756d62" text-anchor="start">COSTS</text><text x="456" y="513" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">the playbook's tokens, only</text><text x="456" y="532" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">on turns that attach it</text><rect x="824" y="130" width="368" height="560" rx="12" fill="#2a201a" stroke="#5e463a" stroke-width="1.4"/><text x="844" y="164" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#e5825a" text-anchor="start">MCP SERVERS</text><text x="844" y="186" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">the rented power tools</text><line x1="844" y1="200" x2="1172" y2="200" stroke="#2b2723"/><text x="844" y="226" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#756d62" text-anchor="start">LIVES IN</text><text x="844" y="246" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start">config.toml in CODEX_HOME:</text><text x="844" y="265" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start">[mcp_servers.openverse]</text><text x="844" y="284" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">command = "npx" + args</text><text x="844" y="315" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#756d62" text-anchor="start">LOADED</text><text x="844" y="335" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">launched by the engine as</text><text x="844" y="354" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">its own child process;</text><text x="844" y="373" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">the agent calls tools mid-turn</text><text x="844" y="392" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">(mcpToolCall items)</text><text x="844" y="423" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#756d62" text-anchor="start">THE PROOF</text><text x="844" y="443" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start">mcpServerStatus/list has the</text><text x="844" y="462" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">inventory; every call is</text><text x="844" y="481" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">gated by an elicitation</text><text x="844" y="512" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="9.5" fill="#756d62" text-anchor="start">COSTS</text><text x="844" y="532" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">a process, a per-call</text><text x="844" y="551" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">approval, and real trust:</text><text x="844" y="570" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">it runs OUTSIDE the sandbox</text>
  <rect x="48" y="714" width="1144" height="120" rx="10" fill="#1d1a17" stroke="#2b2723"/>
  <text x="68" y="742" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#756d62" text-anchor="start">THE LAYERS COMPOSE (all three live in the canonical run)</text>
  <text x="68" y="768" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49c90" text-anchor="start">The poster keeps every build self-contained &#183; the pattern book reads the client's assets before styling &#183;</text>
  <text x="68" y="790" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49c90" text-anchor="start">the rented tool finds the photograph. Different layers, one turn: none of them edits a prompt.</text>
</svg>