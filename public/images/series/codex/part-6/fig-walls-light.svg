<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" role="img">
  <rect width="1240" height="780" fill="#faf9f6"/>
  <text x="48" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2.5" fill="#8f887a">HOW THE BOX IS BUILT &#183; workspaceWrite, DRAWN HONESTLY</text>
  <line x1="48" y1="66" x2="1192" y2="66" stroke="#e7e3d9" stroke-width="1.5"/>
  <path d="M 70 130 L 570 130 L 570 460 L 70 460" fill="none" stroke="#b91c1c" stroke-width="3"/><line x1="70" y1="130" x2="70" y2="460" stroke="#92600a" stroke-width="2" stroke-dasharray="7 7"/><rect x="220" y="220" width="290" height="150" rx="10" fill="#f2f7e8" stroke="#3f6212" stroke-width="1.5"/><text x="365" y="279" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="14" fill="#3f6212" text-anchor="middle">the workspace</text><text x="365" y="301" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#5b554c" text-anchor="middle">writableRoots: [projects/{id}/site]</text><text x="365" y="321" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#92600a" text-anchor="middle">+ /tmp (excludeSlashTmp defaults off)</text><text x="320" y="116" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#b91c1c" text-anchor="middle">WRITES outside the bench: blocked at the syscall</text><text x="586" y="287" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#b91c1c" transform="rotate(90 586 287)" text-anchor="middle">NETWORK incl. DNS: blocked until networkAccess</text><text x="320" y="484" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#8f887a" text-anchor="middle">the same wall all the way around: no writes land outside writableRoots</text><text x="52" y="295" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#92600a" transform="rotate(-90 52 295)" text-anchor="middle">READS: open. the whole disk is visible</text><rect x="70" y="508" width="240" height="54" rx="10" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/><text x="190" y="530" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#1f1c19" text-anchor="middle">macOS: Seatbelt</text><text x="190" y="550" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#8f887a" text-anchor="middle">(sandbox-exec profiles)</text><rect x="330" y="508" width="240" height="54" rx="10" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/><text x="450" y="530" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#1f1c19" text-anchor="middle">Linux: Landlock + seccomp</text><text x="450" y="550" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#8f887a" text-anchor="middle">(kernel 5.13+; Part 13 re-verifies)</text><text x="320" y="590" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="middle">a refusal is a kernel error, not a model decision</text>
  <rect x="660" y="106" width="532" height="556" rx="12" fill="#f1efe9" stroke="#e7e3d9" stroke-width="1.5"/><text x="684" y="138" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8f887a" text-anchor="start">WHAT THE WIRE SHOWS WHEN A WALL IS HIT</text><rect x="684" y="158" width="484" height="128" rx="10" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/><text x="704" y="188" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="13" fill="#1f1c19" text-anchor="start">1 &#183; Blocked network</text><rect x="994.4" y="172" width="125.6" height="24" rx="12" fill="none" stroke="#3f6212"/><text x="1057.2" y="188" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#3f6212" text-anchor="middle">ITEM ON THE WIRE</text><text x="704" y="216" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start">commandExecution completes: status "failed",</text><text x="704" y="236" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start">exitCode 6, aggregatedOutput carries the curl error.</text><text x="704" y="256" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start">The one wall with real item telemetry.</text><rect x="684" y="306" width="484" height="128" rx="10" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/><text x="704" y="336" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="13" fill="#1f1c19" text-anchor="start">2 &#183; Blocked write, natural</text><rect x="1053.8" y="320" width="66.19999999999999" height="24" rx="12" fill="none" stroke="#92600a"/><text x="1086.9" y="336" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#92600a" text-anchor="middle">NO ITEM</text><text x="704" y="364" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start">Usually never happens: the model reads its</text><text x="704" y="384" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start">writableRoots and declines up front. No failed item,</text><text x="704" y="404" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start">no item at all. The wall worked by being known.</text><rect x="684" y="454" width="484" height="128" rx="10" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/><text x="704" y="484" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="13" fill="#1f1c19" text-anchor="start">3 &#183; Blocked write, forced</text><rect x="1034" y="468" width="86" height="24" rx="12" fill="none" stroke="#b91c1c"/><text x="1077" y="484" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#b91c1c" text-anchor="middle">ZERO ITEMS</text><text x="704" y="512" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start">Runs via the unifiedExec path: ZERO commandExecution</text><text x="704" y="532" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start">items emitted. "zsh:1: operation not permitted: ..."</text><text x="704" y="552" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start">appears only inside the agent's narration text.</text><text x="926" y="636" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="middle">no sandbox_blocked event exists at this pin (0.142.4):</text><text x="926" y="654" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="middle">your telemetry is exit codes plus the narration</text>
  <text x="620" y="746" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#8f887a" text-anchor="middle">Writes and network are walls; reads are a policy gap you design around. And only one of the three refusals is visible as an item.</text>
</svg>