  <text x="730" y="114" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="middle">CONSENT &#183; approvalPolicy &#183; when does a human get asked?</text><text x="430" y="148" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a49c90" text-anchor="middle">untrusted</text><text x="630" y="148" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a49c90" text-anchor="middle">on-failure</text><text x="830" y="148" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a49c90" text-anchor="middle">on-request</text><text x="1030" y="148" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a49c90" text-anchor="middle">never</text><text x="64" y="390" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="middle" transform="rotate(-90 64 390)">CONTAINMENT &#183; sandboxPolicy &#183; what may commands touch?</text><text x="304" y="221" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a49c90" text-anchor="end">readOnly</text><text x="304" y="241" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="end">look and plan</text><text x="304" y="331" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a49c90" text-anchor="end">workspaceWrite</text><text x="304" y="351" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="end">network off</text><text x="304" y="441" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a49c90" text-anchor="end">workspaceWrite</text><text x="304" y="461" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="end">network on</text><text x="304" y="551" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#e08585" text-anchor="end">dangerFullAccess</text><text x="304" y="57