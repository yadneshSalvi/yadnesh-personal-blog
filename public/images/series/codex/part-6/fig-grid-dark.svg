  <text x="620" y="740" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#a49c90" text-anchor="middle">The sandbox contains; approvals ask. Independent dials: Act I ran entirely in Standard's cell,</text>
