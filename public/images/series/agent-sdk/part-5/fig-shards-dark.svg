<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520">
  <rect width="1240" height="520" fill="#151311"/>
  <text x="56" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#756d62">WHERE THE DIARIES LIVE &#183; PER-CWD SHARDS, AND HOW THE SIDEBAR READS THEM</text>
  <text x="56" y="104" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2.5" fill="#756d62">YOUR SERVER &#183; backend/workspaces/</text><rect x="56" y="120" width="330" height="108" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/><text x="76" y="152" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ebe7df" xml:space="preserve">10e36807&#8230;/</text><text x="76" y="172" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" xml:space="preserve">  sales.csv &#183; stores.csv &#183; &#8230;</text><text x="76" y="200" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ebe7df" xml:space="preserve">d0df4e91&#8230;/</text><text x="76" y="220" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" xml:space="preserve">  + store_growth.png &#183; report.md</text><text x="700" y="104" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2.5" fill="#756d62">THE SDK'S WORLD &#183; ~/.claude/projects/</text><rect x="700" y="120" width="484" height="64" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/><text x="720" y="146" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#ebe7df" xml:space="preserve">&#8230;-workspaces-10e36807&#8230;/</text><text x="720" y="166" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#a3c57d" xml:space="preserve">  407ce10d-&#8230;.jsonl</text><rect x="700" y="196" width="484" height="84" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/><text x="720" y="222" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#ebe7df" xml:space="preserve">&#8230;-workspaces-d0df4e91&#8230;/</text><text x="720" y="242" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#a3c57d" xml:space="preserve">  8664da65-&#8230;.jsonl</text><text x="940" y="242" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" xml:space="preserve">&#8592; the conversation</text><text x="720" y="262" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#a3c57d" xml:space="preserve">  caf6b788-&#8230;.jsonl</text><text x="940" y="262" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" xml:space="preserve">&#8592; its fork</text><line x1="392" y1="150" x2="688" y2="150" stroke="#a49c90" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M 688 143 L 688 157 L 700 150 Z" fill="#a49c90"/>
  <line x1="392" y1="208" x2="688" y2="230" stroke="#a49c90" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M 687 223 L 690 237 L 700 232 Z" fill="#a49c90"/>
  <text x="470" y="132" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#e5825a">one shard per cwd</text><rect x="56" y="316" width="1128" height="96" rx="12" fill="#211e1a" stroke="#5e463a" stroke-width="1.5"/><text x="76" y="348" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#e5825a">THE SIDEBAR WALK</text><text x="76" y="374" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ebe7df" xml:space="preserve">for ws in WORKSPACES_ROOT.iterdir():</text><text x="76" y="394" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ebe7df" xml:space="preserve">    list_sessions(directory=str(ws))   # scoped: only OUR desks' diaries</text><text x="56" y="452" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a49c90">Unscoped <tspan font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#f0a8a8">list_sessions()</tspan> returns every session on the machine. On my laptop that was <tspan font-weight="700" fill="#ebe7df">415 conversations</tspan>,</text>
  <text x="56" y="474" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#a49c90">including my own Claude Code history. A sidebar built on it would leak the developer's life into the product.</text>
</svg>