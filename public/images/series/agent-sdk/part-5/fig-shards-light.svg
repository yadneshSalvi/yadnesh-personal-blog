<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520">
  <rect width="1240" height="520" fill="#faf9f6"/>
  <text x="56" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#8f887a">WHERE THE DIARIES LIVE &#183; PER-CWD SHARDS, AND HOW THE SIDEBAR READS THEM</text>
  <text x="56" y="104" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2.5" fill="#8f887a">YOUR SERVER &#183; backend/workspaces/</text><rect x="56" y="120" width="330" height="108" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/><text x="76" y="152" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#1f1c19" xml:space="preserve">10e36807&#8230;/</text><text x="76" y="172" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8f887a" xml:space="preserve">  sales.csv &#183; stores.csv &#183; &#8230;</text><text x="76" y="200" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#1f1c19" xml:space="preserve">d0df4e91&#8230;/</text><text x="76" y="220" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8f887a" xml:space="preserve">  + store_growth.png &#183; report.md</text><text x="700" y="104" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2.5" fill="#8f887a">THE SDK'S WORLD &#183; ~/.claude/projects/</text><rect x="700" y="120" width="484" height="64" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/><text x="720" y="146" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#1f1c19" xml:space="preserve">&#8230;-workspaces-10e36807&#8230;/</text><text x="720" y="166" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#3f6212" xml:space="preserve">  407ce10d-&#8230;.jsonl</text><rect x="700" y="196" width="484" height="84" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/><text x="720" y="222" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#1f1c19" xml:space="preserve">&#8230;-workspaces-d0df4e91&#8230;/</text><text x="720" y="242" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#3f6212" xml:space="preserve">  8664da65-&#8230;.jsonl</text><text x="940" y="242" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8f887a" xml:space="preserve">&#8592; the conversation</text><text x="720" y="262" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#3f6212" xml:space="preserve">  caf6b788-&#8230;.jsonl</text><text x="940" y="262" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8f887a" xml:space="preserve">&#8592; its fork</text><line x1="392" y1="150" x2="688" y2="150" stroke="#5b554c" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M 688 143 L 688 157 L 700 150 Z" fill="#5b554c"/>
  <line x1="392" y1="208" x2="688" y2="230" stroke="#5b554c" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M 687 223 L 690 237 L 700 232 Z" fill="#5b554c"/>
  <text x="470" y="132" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#b3441a">one shard per cwd</text><rect x="56" y="316" width="1128" height="96" rx="12" fill="#ffffff" stroke="#dcb09a" stroke-width="1.5"/><text x="76" y="348" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#b3441a">THE SIDEBAR WALK</text><text x="76" y="374" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#1f1c19" xml:space="preserve">for ws in WORKSPACES_ROOT.iterdir():</text><text x="76" y="394" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#1f1c19" xml:space="preserve">    list_sessions(directory=str(ws))   # scoped: only OUR desks' diaries</text><text x="56" y="452" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5b554c">Unscoped <tspan font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#b91c1c">list_sessions()</tspan> returns every session on the machine. On my laptop that was <tspan font-weight="700" fill="#1f1c19">415 conversations</tspan>,</text>
  <text x="56" y="474" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5b554c">including my own Claude Code history. A sidebar built on it would leak the developer's life into the product.</text>
</svg>