<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500">
  <rect width="1240" height="500" fill="#faf9f6"/>
  <text x="56" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#8f887a">RESUME CONTINUES A LINE &#183; FORK MAKES IT A TREE &#183; IDS FROM THE REAL RUN</text>
  
  <line x1="140" y1="170" x2="1000" y2="170" stroke="#e7e3d9" stroke-width="3"/><circle cx="200" cy="170" r="9" fill="#b3441a"/><text x="200" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f1c19" text-anchor="middle">turn 1</text><text x="200" y="204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8f887a" text-anchor="middle">"grew fastest?"</text><circle cx="420" cy="170" r="9" fill="#b3441a"/><text x="420" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f1c19" text-anchor="middle">turn 2</text><text x="420" y="204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8f887a" text-anchor="middle">"chart that store"</text><circle cx="640" cy="170" r="9" fill="#b3441a"/><text x="640" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f1c19" text-anchor="middle">turn 3</text><text x="640" y="204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8f887a" text-anchor="middle">resume=8664da65&#8230;</text><circle cx="860" cy="170" r="9" fill="#b3441a"/><text x="860" y="146" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f1c19" text-anchor="middle">turn 4</text><text x="860" y="204" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8f887a" text-anchor="middle">resume=8664da65&#8230;</text><text x="120" y="175" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#1f1c19" text-anchor="end">session</text>
  <text x="120" y="192" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8f887a" text-anchor="end">8664da65&#8230;</text><path d="M 640 170 C 700 210, 700 280, 760 320" fill="none" stroke="#dcb09a" stroke-width="3"/><line x1="760" y1="320" x2="1000" y2="320" stroke="#e7e3d9" stroke-width="3"/><circle cx="760" cy="320" r="9" fill="#b3441a"/><text x="760" y="354" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8f887a" text-anchor="middle">inherits turns 1-3</text><circle cx="940" cy="320" r="9" fill="#b3441a"/><text x="940" y="296" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f1c19" text-anchor="middle">new turn</text><text x="940" y="354" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8f887a" text-anchor="middle">resume=caf6b788&#8230;</text><text x="742" y="325" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#1f1c19" text-anchor="end">fork</text>
  <text x="742" y="342" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8f887a" text-anchor="end">caf6b788&#8230;</text><text x="660" y="253" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#b3441a" text-anchor="end">fork_session(&#8230;)</text>
  <text x="660" y="271" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8f887a" text-anchor="end">copies the diary, new id, no model call, $0</text><text x="56" y="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5b554c">The original never notices. Both branches stay resumable forever, and both write to the same desk:</text>
  <text x="56" y="442" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#5b554c">the fork copies the <tspan font-style="italic">diary</tspan>, not the <tspan font-style="italic">workspace</tspan>. New charts land where both branches can see them.</text>
  <text x="56" y="468" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1f1c19">A conversation is a line until you photocopy the diary. <tspan font-style="italic" fill="#b3441a">Then it's a tree.</tspan></text>
</svg>