  <text x="738" y="365" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="end">BASH</text>
  <path d="M 750 358 l 5 6 l 5 -6" fill="none" stroke="#78716c" stroke-width="1.8"/>
  
  <text x="200" y="415" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e7e5e4">The Downtown store had the highest revenue in March with $51,319.60.</text>
  
  <text x="200" y="451" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"  fill="#e7e5e4">Here's the breakdown of all stores' revenue in March:</text>
  
  <text x="216" y="488" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e7e5e4">1.  <tspan font-weight="700">Downtown</tspan>  $51,319.60</text>
  <text x="216" y="515" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e7e5e4">2.  <tspan font-weight="700">Airport</tspan>  $43,425.90</text>
  <text x="216" y="542" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e7e5e4">3.  <tspan font-weight="700">Harborview</tspan>  $33,339.30</text>
  <text x="216" y="569" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e7e5e4">4.  <tspan font-weight="700">Old Town</tspan>  $27,282.10</text>
  <text x="216" y="596" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e7e5e4">5.  <tspan font-weight="700">University</tspan>  $26,772.40</text>
  <text x="216" y="623" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#e7e5e4">6.  <tspan font-weight="700">Riverside</tspan>  $24,676.50</text>
  <text x="200" y="658" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#78716c">$0.0253 · 25s</text>
