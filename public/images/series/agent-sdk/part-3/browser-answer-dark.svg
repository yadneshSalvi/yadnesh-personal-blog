  <text x="215" y="274" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f87171">&#x2715;</text>
  <text x="236" y="274" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d6d3d1">Running: python3 &lt;&lt; 'EOF' import pandas as pd # Read the CSV files sal…</text>
  <text x="738" y="273" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="end">BASH</text>
