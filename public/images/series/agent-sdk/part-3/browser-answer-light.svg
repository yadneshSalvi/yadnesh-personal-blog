  <text x="200" y="415" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1c1917">The Downtown store had the highest revenue in March with $51,319.60.</text>
  
  <text x="200" y="451" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"  fill="#1c1917">Here's the breakdown of all stores' revenue in March:</text>
  
  <text x="216" y="488" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1c1917">1.  <tspan font-weight="700">Downtown</tspan>  $51,319.60</text>
  <text x="216" y="515" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1c1917">2.  <tspan font-weight="700">Airport</tspan>  $43,425.90</text>
  <text x="216" y="542" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1c1917">3.  <tspan font-weight="700">Harborview</tspan>  $33,339.30</text>
