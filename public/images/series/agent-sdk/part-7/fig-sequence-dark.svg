<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780">
  <rect width="1240" height="780" fill="#151311"/>
  <text x="56" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#756d62">THE APPROVAL BRIDGE &#183; ONE REAL RUN, TIMESTAMPED</text>
  <line x1="210" y1="128" x2="210" y2="700" stroke="#2b2723" stroke-width="2"/>
  <text x="210" y="96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#ebe7df" text-anchor="middle">THE AGENT</text>
  <text x="210" y="114" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#756d62" text-anchor="middle">SDK subprocess</text><line x1="620" y1="128" x2="620" y2="700" stroke="#2b2723" stroke-width="2"/>
  <text x="620" y="96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#ebe7df" text-anchor="middle">YOUR SERVER</text>
  <text x="620" y="114" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#756d62" text-anchor="middle">gate() + the Future</text><line x1="1030" y1="128" x2="1030" y2="700" stroke="#2b2723" stroke-width="2"/>
  <text x="1030" y="96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2" fill="#ebe7df" text-anchor="middle">THE HUMAN</text>
  <text x="1030" y="114" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#756d62" text-anchor="middle">browser, two buttons</text><text x="60" y="165" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="start" xml:space="preserve">12.85s</text><line x1="210" y1="160" x2="600" y2="160" stroke="#a49c90" stroke-width="2" />
  <path d="M 610 160 L 598 154 L 598 166 Z" fill="#a49c90"/><text x="410" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a49c90" text-anchor="middle">ToolUseBlock: Bash (the badge appears, spinner on)</text><text x="60" y="205" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="start" xml:space="preserve">12.87s</text><circle cx="620" cy="200" r="6" fill="#e5825a"/><text x="636" y="192" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#ebe7df" text-anchor="start">can_use_tool fires. A Future is parked in PENDING;</text><text x="636" y="208" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#ebe7df" text-anchor="start">the callback awaits it and simply does not return.</text><line x1="620" y1="232" x2="1010" y2="232" stroke="#e5825a" stroke-width="2" />
  <path d="M 1020 232 L 1008 226 L 1008 238 Z" fill="#e5825a"/><text x="820" y="222" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#e5825a" text-anchor="middle" xml:space="preserve">{"type": "approval_request", &#8230;}</text><text x="1030" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#756d62" text-anchor="middle">the card renders</text><rect x="150" y="272" width="960" height="120" rx="12" fill="#2a201a" stroke="#5e463a" stroke-width="1.5" stroke-dasharray="7 5"/><text x="630" y="316" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#ebe7df" text-anchor="middle">Six seconds of genuine silence.</text><text x="630" y="342" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="middle">Zero events on the stream, zero API calls, zero tokens. The agent is not polling or spinning:</text><text x="630" y="360" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="middle">it is one await, parked, costing nothing until somebody resumes it.</text><text x="60" y="322" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="start" xml:space="preserve">12.87s</text><text x="60" y="340" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="start" xml:space="preserve">&#8595;</text><text x="60" y="358" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="start" xml:space="preserve">18.87s</text><text x="60" y="432" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="start" xml:space="preserve">18.87s</text><line x1="1030" y1="426" x2="640" y2="426" stroke="#a49c90" stroke-width="2" />
  <path d="M 630 426 L 642 420 L 642 432 Z" fill="#a49c90"/><text x="830" y="414" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a49c90" text-anchor="middle">POST /approvals/{id}/decision  {"decision": "allow"}</text><text x="60" y="472" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="start" xml:space="preserve">18.88s</text><circle cx="620" cy="466" r="6" fill="#a3c57d"/><text x="636" y="462" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#ebe7df" text-anchor="start">future.set_result(): the parked await wakes up,</text><text x="636" y="478" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#ebe7df" text-anchor="start">the callback returns PermissionResultAllow.</text><line x1="620" y1="500" x2="230" y2="500" stroke="#a3c57d" stroke-width="2" />
  <path d="M 220 500 L 232 494 L 232 506 Z" fill="#a3c57d"/><text x="420" y="492" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a49c90" text-anchor="middle">the SDK lets the tool run</text><line x1="620" y1="524" x2="1010" y2="524" stroke="#756d62" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M 1020 524 L 1008 518 L 1008 530 Z" fill="#756d62"/><text x="830" y="514" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="middle" xml:space="preserve">{"type": "approval_resolved", &#8230;}</text><text x="60" y="585" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="start" xml:space="preserve">29.49s</text><line x1="210" y1="580" x2="600" y2="580" stroke="#a49c90" stroke-width="2" />
  <path d="M 610 580 L 598 574 L 598 586 Z" fill="#a49c90"/><text x="410" y="568" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a49c90" text-anchor="middle">tool_result: the chart exists; the panel lights up</text><text x="620" y="656" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#ebe7df" text-anchor="middle">An event goes out. A Future waits. <tspan font-style="italic" fill="#e5825a">A click comes back.</tspan></text><text x="620" y="682" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#756d62" text-anchor="middle">Timestamps from the scripted approve run on 2026-07-04; the six-second gap is the scripted human thinking time.</text>
</svg>