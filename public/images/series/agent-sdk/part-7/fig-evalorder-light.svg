<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700">
  <rect width="1240" height="700" fill="#faf9f6"/>
  <text x="56" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#8f887a">THE PERMISSION GAUNTLET &#183; WHAT A TOOL CALL PASSES BEFORE IT REACHES YOU</text>
  <text x="56" y="100" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#1f1c19" xml:space="preserve">a tool call leaves the model</text><line x1="120" y1="112" x2="120" y2="140" stroke="#5b554c" stroke-width="2"/><path d="M 120 148 L 114 136 L 126 136 Z" fill="#5b554c"/><rect x="56" y="148" width="700" height="64" rx="12" fill="none" stroke="#e7e3d9" stroke-width="1.5" stroke-dasharray="7 5"/><text x="76" y="174" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#8f887a" xml:space="preserve">1 &#183; HOOKS</text><text x="76" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8f887a">run before everything, see everything, deterministic. Part 8's whole subject.</text><rect x="56" y="228" width="700" height="84" rx="12" fill="#ffffff" stroke="#dcb09a" stroke-width="1.5" /><text x="76" y="254" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#b3441a" xml:space="preserve">2 &#183; THE ENGINE'S OWN JUDGMENT</text><text x="76" y="276" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c">Reads inside the cwd and read-only shell commands are approved by the</text><text x="76" y="294" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c">engine itself, before any rule of yours is consulted.</text><rect x="56" y="328" width="700" height="84" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="76" y="354" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#1f1c19" xml:space="preserve">3 &#183; allowed_tools</text><text x="76" y="376" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c">Name matches are waved through: Read, Glob, Grep, and both</text><text x="76" y="394" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c">mcp__beanline__* tools in this app. No callback, no card.</text><rect x="56" y="428" width="700" height="64" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="76" y="454" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#1f1c19" xml:space="preserve">4 &#183; permission_mode</text><text x="76" y="476" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c">default from today. bypassPermissions used to end the story right here.</text><rect x="56" y="508" width="700" height="84" rx="12" fill="#f6e7df" stroke="#dcb09a" stroke-width="1.5" /><text x="76" y="534" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#b3441a" xml:space="preserve">5 &#183; can_use_tool &#183; YOU</text><text x="76" y="556" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c">Only calls that survived every gate above reach the callback:</text><text x="76" y="574" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c">in this app, mutating Bash and Write. That is what the card is for.</text><line x1="120" y1="212" x2="120" y2="224" stroke="#5b554c" stroke-width="2"/><path d="M 120 232 L 114 220 L 126 220 Z" fill="#5b554c"/><line x1="120" y1="312" x2="120" y2="324" stroke="#5b554c" stroke-width="2"/><path d="M 120 332 L 114 320 L 126 320 Z" fill="#5b554c"/><line x1="120" y1="412" x2="120" y2="424" stroke="#5b554c" stroke-width="2"/><path d="M 120 432 L 114 420 L 126 420 Z" fill="#5b554c"/><line x1="120" y1="492" x2="120" y2="504" stroke="#5b554c" stroke-width="2"/><path d="M 120 512 L 114 500 L 126 500 Z" fill="#5b554c"/><text x="800" y="160" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8f887a" xml:space="preserve">LIVE RECEIPTS (THIS APP, 2026-07-04)</text><rect x="800" y="176" width="384" height="136" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="818" y="202" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#1f1c19" xml:space="preserve">wc -l sales.csv   (Bash!)</text><text x="818" y="222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b554c">ran with no card: gate 2 approved it.</text><text x="818" y="240" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b554c">The callback never heard about it.</text><text x="818" y="264" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8f887a" xml:space="preserve">$0.0229 &#183; 5s &#183; 0 cards</text><text x="818" y="292" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#1f1c19" xml:space="preserve">rm / matplotlib / Write &#8594; card</text><rect x="800" y="328" width="384" height="116" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="818" y="354" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f1c19">Auto-approved calls never reach you.</text><text x="818" y="374" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b554c">The callback is a gate, not a log: it decides</text><text x="818" y="392" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b554c">for the risky calls and is blind to the rest.</text><text x="818" y="418" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#b3441a">The layer that sees everything is Part 8.</text><text x="56" y="652" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1f1c19">Approvals gate what the engine considers risky. <tspan font-style="italic" fill="#b3441a">Seeing everything is a different layer.</tspan></text>
</svg>