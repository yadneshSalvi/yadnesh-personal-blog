<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="916" viewBox="0 0 1240 916">
  <rect width="1240" height="916" fill="#151311"/>
  <text x="56" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#756d62">DURABLE STREAMS &#183; RUN THE AGENT ONCE, WATCH IT FROM ANYWHERE</text>
  <rect x="56" y="84" width="300" height="96" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5" /><text x="76" y="112" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="start" xml:space="preserve">THE BROWSER</text><text x="76" y="136" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#ebe7df" text-anchor="start" xml:space="preserve">POST /chat</text><text x="76" y="158" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a49c90" text-anchor="start">sends the question, hangs up in</text><text x="76" y="174" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a49c90" text-anchor="start">milliseconds. No stream attached.</text><line x1="356" y1="132" x2="436" y2="132" stroke="#a49c90" stroke-width="2" /><polygon points="448,132 436.12984377594,137.3008858897744 436.12984377594,126.6991141102256" fill="#a49c90"/><text x="360" y="118" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#756d62" text-anchor="start" xml:space="preserve">claim ticket</text><rect x="448" y="84" width="380" height="96" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5" /><text x="468" y="112" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="start" xml:space="preserve">THE RESPONSE (a claim ticket)</text><text x="468" y="136" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#ebe7df" text-anchor="start" xml:space="preserve">{"request_id": "53cb43fa…",</text><text x="468" y="156" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#ebe7df" text-anchor="start" xml:space="preserve"> "stream_url": "/stream/53cb43fa…"}</text><line x1="206" y1="180" x2="206" y2="220" stroke="#a49c90" stroke-width="2" /><polygon points="206,232 200.6991141102256,220.12984377594 211.3008858897744,220.12984377594" fill="#a49c90"/><text x="220" y="212" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#756d62" text-anchor="start" xml:space="preserve">start_request() spawns a task</text><rect x="56" y="232" width="430" height="210" rx="12" fill="#2a201a" stroke="#5e463a" stroke-width="1.5" /><text x="76" y="260" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#e5825a" text-anchor="start" xml:space="preserve">THE WORKER · asyncio.create_task</text><text x="76" y="288" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#ebe7df" text-anchor="start" xml:space="preserve">ClaudeSDKClient</text><text x="300" y="288" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">holds interrupt(): the Stop button</text><text x="76" y="312" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#ebe7df" text-anchor="start" xml:space="preserve">translate() + with_artifacts()</text><text x="330" y="312" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">Parts 2-6, unchanged</text><text x="76" y="336" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#ebe7df" text-anchor="start" xml:space="preserve">ApprovalBridge.gate()</text><text x="280" y="336" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">Part 7's cards, now durable too</text><text x="76" y="366" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#ebe7df" text-anchor="start" xml:space="preserve">RUNNING[request_id] = task, client, bridge</text><text x="76" y="388" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">the dict is load-bearing: asyncio keeps only weak references to</text><text x="76" y="404" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">tasks. Unstored tasks can vanish mid-run, collected as garbage.</text><text x="76" y="426" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#756d62" text-anchor="start">Nobody holds a pipe to this. It cooks whether anyone watches or not.</text><line x1="180" y1="442" x2="180" y2="488" stroke="#a49c90" stroke-width="2" /><polygon points="180,500 174.6991141102256,488.12984377594 185.3008858897744,488.12984377594" fill="#a49c90"/><text x="194" y="476" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#756d62" text-anchor="start" xml:space="preserve">emit(): 1. append</text><line x1="410" y1="442" x2="608.7508967358829" y2="515.8217616447565" stroke="#a49c90" stroke-width="2" /><polygon points="620,520 607.0269185110767,520.8361558956061 610.7183126346475,510.89778710137716" fill="#a49c90"/><text x="470" y="470" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#756d62" text-anchor="start" xml:space="preserve">emit(): 2. publish</text><rect x="56" y="500" width="430" height="240" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5" /><text x="76" y="528" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#e5825a" text-anchor="start" xml:space="preserve">THE EVENT LOG · SQLite events.db</text><text x="76" y="554" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="start" xml:space="preserve">request_id        seq  type</text><text x="76" y="576" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start" xml:space="preserve">53cb43fa…          1   session_start</text><text x="76" y="596" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start" xml:space="preserve">53cb43fa…          2   tool_use_start</text><text x="76" y="616" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start" xml:space="preserve">53cb43fa…          3   tool_result</text><text x="76" y="636" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="start" xml:space="preserve">  …               …   (a real run: 31 rows)</text><text x="76" y="656" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start" xml:space="preserve">53cb43fa…         31   complete</text><text x="76" y="684" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">committed before anyone sees it: the log is the truth,</text><text x="76" y="700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">the broadcast is a courtesy copy. Survives kill -9.</text><text x="76" y="722" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="start" xml:space="preserve">replay = WHERE seq > last_seen ORDER BY seq</text><rect x="620" y="520" width="250" height="150" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5" /><text x="640" y="548" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#e5825a" text-anchor="start" xml:space="preserve">THE BROADCAST HUB</text><text x="640" y="572" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start" xml:space="preserve">dict[request_id,</text><text x="640" y="590" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start" xml:space="preserve">     set[asyncio.Queue]]</text><text x="640" y="614" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">fans out (seq, event) to every</text><text x="640" y="630" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">open queue. Remembers nothing.</text><text x="640" y="652" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#756d62" text-anchor="start">in-process, on purpose (see below)</text><rect x="940" y="300" width="260" height="96" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5" /><text x="956" y="324" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start" xml:space="preserve">TAB A · GET /stream/53cb…</text><text x="956" y="346" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">followed live from seq 1;</text><text x="956" y="362" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">receipt arrived on this pipe</text><text x="956" y="382" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#756d62" text-anchor="start" xml:space="preserve">$0.0351 · 11s</text><rect x="940" y="420" width="260" height="110" rx="12" fill="#211e1a" stroke="#5e463a" stroke-width="1.5" /><text x="956" y="444" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#e5825a" text-anchor="start" xml:space="preserve">TAB A, RELOADED MID-RUN</text><text x="956" y="466" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">replayed seq 1-15 in one burst</text><text x="956" y="482" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">(question back in 126 ms), then</text><text x="956" y="498" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">followed the live tail. Same turn.</text><text x="956" y="518" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#756d62" text-anchor="start" xml:space="preserve">Last-Event-ID on reconnects</text><rect x="940" y="554" width="260" height="96" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5" /><text x="956" y="578" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#ebe7df" text-anchor="start" xml:space="preserve">A SECOND TAB · or curl -N</text><text x="956" y="600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">joined mid-run: replay, then</text><text x="956" y="616" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">follow. Identical story, verified</text><text x="956" y="636" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#756d62" text-anchor="start" xml:space="preserve">byte-identical transcripts</text><line x1="870" y1="560" x2="936.1052632802161" y2="367.35037558337024" stroke="#a49c90" stroke-width="2" /><polygon points="940,356 941.1613260381757,368.9480238582208 931.1334850759213,365.50709803783934" fill="#a49c90"/><line x1="870" y1="585" x2="933.3435976452972" y2="489.9846035320541" stroke="#a49c90" stroke-width="2" /><polygon points="940,480 937.8262256781279,492.81696942329074 929.0050183484517,486.9361645368399" fill="#a49c90"/><line x1="870" y1="620" x2="928.4617126283101" y2="603.2966535347686" stroke="#a49c90" stroke-width="2" /><polygon points="940,600 930.0428258788227,608.3579114329212 927.1302951778345,598.1640539794624" fill="#a49c90"/><line x1="486" y1="516" x2="928.1174856675339" y2="453.67506809973094" stroke="#756d62" stroke-width="2" stroke-dasharray="6 5"/><polygon points="940,452 928.9860036161058,458.90593104914643 927.5061128070599,448.40795562247774" fill="#756d62"/><text x="620" y="700" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#756d62" text-anchor="start" xml:space="preserve">solid arrows: the live tail, from the hub</text><text x="620" y="716" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#756d62" text-anchor="start" xml:space="preserve">dashed: the replay, from the log</text><rect x="620" y="232" width="250" height="96" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5" /><text x="640" y="260" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#ebe7df" text-anchor="start" xml:space="preserve">POST /chat/{id}/cancel</text><text x="640" y="282" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#a49c90" text-anchor="start">looks up RUNNING[id], calls</text><text x="640" y="302" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#e5825a" text-anchor="start" xml:space="preserve">client.interrupt()</text><text x="640" y="320" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#756d62" text-anchor="start" xml:space="preserve">receipt 39 ms after the click</text><line x1="620" y1="300" x2="497.86853240511635" y2="318.22857725296774" stroke="#a49c90" stroke-width="2" /><polygon points="486,320 496.95760199620673,313.00493327460515 498.5226203036349,323.49055593437373" fill="#a49c90"/><text x="620" y="780" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#ebe7df">The log remembers the past.</text><text x="620" y="808" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#ebe7df">The hub carries the present. Every</text><text x="620" y="836" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#ebe7df">subscriber does <tspan font-style="italic" fill="#e5825a">replay, then follow</tspan>.</text><text x="620" y="868" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">Subscribe first, replay second, deduplicate by seq: that order is</text><text x="620" y="886" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">what closes the gap an event could otherwise fall through.</text><text x="56" y="780" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">Scope, honestly: the hub is one process's memory. Two uvicorn</text><text x="56" y="798" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">workers would mean two half-blind hubs. Production swaps the</text><text x="56" y="816" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">hub for Redis pub/sub or Postgres LISTEN/NOTIFY and the log</text><text x="56" y="834" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a49c90" text-anchor="start">for a real table. The shape on this page is the part that stays.</text><text x="56" y="868" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="start" xml:space="preserve">SQLite is the training wheels. The architecture is the lesson.</text>
</svg>