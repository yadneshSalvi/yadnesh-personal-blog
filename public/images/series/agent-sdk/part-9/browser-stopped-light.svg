  <text x="476" y="155" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#fafaf9">Walk month by month from January to June using the database:</text>
  <text x="476" y="177" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#fafaf9">one query per month, each store's revenue, then a ranking table.</text>
