<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760">
  <rect width="1240" height="760" fill="#faf9f6"/>
  <text x="56" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#8f887a">THE MCP ECOSYSTEM &#183; ONE CONFIG BLOCK, THOUSANDS OF SERVERS</text>
  <text x="56" y="96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8f887a" text-anchor="start" xml:space="preserve">THE WHOLE INTEGRATION</text><rect x="56" y="110" width="560" height="150" rx="12" fill="#ffffff" stroke="#dcb09a" stroke-width="1.5" /><text x="80" y="140" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#1f1c19" text-anchor="start" xml:space="preserve">mcp_servers={</text><text x="80" y="162" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#5b554c" text-anchor="start" xml:space="preserve">    "beanline": beanline_server,   # yours, in-process</text><text x="80" y="184" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#b3441a" text-anchor="start" xml:space="preserve">    "fetch": {"command": "python",</text><text x="80" y="206" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#b3441a" text-anchor="start" xml:space="preserve">              "args": ["-m", "mcp_server_fetch"]},</text><text x="80" y="228" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#1f1c19" text-anchor="start" xml:space="preserve">},</text><text x="80" y="250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5"  fill="#5b554c" text-anchor="start">One block. The toolbox gains mcp__fetch__fetch, and the open web with it.</text><text x="660" y="96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8f887a" text-anchor="start" xml:space="preserve">TWO CONFIG SHAPES</text><rect x="660" y="110" width="524" height="70" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="684" y="138" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#1f1c19" text-anchor="start" xml:space="preserve">"stdio":  {"command": "...", "args": [...],</text><text x="684" y="160" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start" xml:space="preserve">           "env": {...}}   a subprocess on pipes</text><rect x="660" y="190" width="524" height="70" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="684" y="218" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#1f1c19" text-anchor="start" xml:space="preserve">"http":   {"type": "http", "url": "https://...",</text><text x="684" y="240" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start" xml:space="preserve">           "headers": {...}}   a remote service</text><text x="56" y="314" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8f887a" text-anchor="start" xml:space="preserve">THREE HOMES FOR A TOOL SERVER</text><rect x="56" y="328" width="336" height="108" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="78" y="358" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#5b554c" text-anchor="start" xml:space="preserve">IN-PROCESS</text><text x="78" y="384" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f1c19" text-anchor="start">Part 6: an @tool function</text><text x="78" y="410" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12"  fill="#5b554c" text-anchor="start">A function call. You wrote it, you trust it.</text><rect x="452" y="328" width="336" height="108" rx="12" fill="#f6e7df" stroke="#dcb09a" stroke-width="1.5" /><text x="474" y="358" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#b3441a" text-anchor="start" xml:space="preserve">STDIO</text><text x="474" y="384" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f1c19" text-anchor="start">Part 12: mcp-server-fetch</text><text x="474" y="410" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12"  fill="#5b554c" text-anchor="start">Someone else's subprocess, spawned on your box.</text><rect x="848" y="328" width="336" height="108" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="870" y="358" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#5b554c" text-anchor="start" xml:space="preserve">HTTP</text><text x="870" y="384" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f1c19" text-anchor="start">a URL you point at</text><text x="870" y="410" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12"  fill="#5b554c" text-anchor="start">A remote service you don't run at all.</text><text x="56" y="476" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#5b554c" text-anchor="start">The trust question climbs left to right: your code, someone's code running as you, someone's service over the wire.</text><text x="56" y="496" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#5b554c" text-anchor="start">All three ride the same mcp_servers= dict, surface tools as mcp__server__tool, and pass the same permission gauntlet.</text><rect x="56" y="524" width="1128" height="66" rx="12" fill="#faf9f6" stroke="#e7e3d9" stroke-width="1.5" /><text x="80" y="554" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#b3441a" text-anchor="start" xml:space="preserve">strict_mcp_config=True</text><text x="280" y="554" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#5b554c" text-anchor="start">keeps the run reader-clean: only the servers you configured exist. Without it, servers</text><text x="80" y="574" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#5b554c" text-anchor="start">from your own machine's Claude settings ride along on your laptop and silently vanish on everyone else's.</text><text x="56" y="732" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#1f1c19">Power tools from the hardware store, versus the ones you <tspan font-style="italic" fill="#b3441a">machined in-house</tspan>.</text>
</svg>