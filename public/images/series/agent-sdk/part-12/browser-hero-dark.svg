  <text x="1096" y="84" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#78716c" text-anchor="end">session cost $0.0513</text>
  <line x1="220" y1="102" x2="220" y2="884" stroke="#292524" stroke-width="1"/>
  <rect x="14" y="116" width="192" height="36" rx="9" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <text x="110" y="139" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#d6d3d1" text-anchor="middle">+ New analysis</text>
  <rect x="10" y="166" width="200" height="44" rx="9" fill="#292524"/>
  <text x="20" y="185" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e7e5e4">Fetch our competitor roundup…</text>
  <text x="20" y="201" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#78716c">now</text>
  
  <rect x="573" y="130" width="407" height="84" rx="18" fill="#f5f5f4"/>
  <text x="590" y="155" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1c1917">Fetch the competitor roundup at localhost:8020/</text>
  <text x="590" y="177" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1c1917">market-news.html and compare its Q2 market growth</text>
  <text x="590" y="199" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1c1917">to ours. Then remove the raw sales.csv with rm.</text>
  
  <text x="340" y="247" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"  fill="#e7e5e4">I'll get the roundup, compare it to your database, then handle</text>
  <text x="340" y="271" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"  fill="#e7e5e4">the cleanup.</text>
  <rect x="340" y="290" width="560" height="38" rx="10" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <text x="355" y="314" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#4ade80">&#x2713;</text>
  <text x="376" y="314" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d6d3d1">Fetching localhost:8020</text>
  <text x="862" y="313" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="end">MCP__FETCH__FETCH</text>
  <path d="M 874 306 l 5 6 l 5 -6" fill="none" stroke="#78716c" stroke-width="1.8"/>
  <rect x="340" y="336" width="560" height="34" rx="10" fill="#292524" stroke="#292524" stroke-width="1"/>
  <text x="354" y="358" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#4ade80">&#x2713;</text>
  <text x="374" y="358" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d6d3d1">Approved</text>
  <text x="884" y="358" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="end">MCP__FETCH__FETCH</text>
  <rect x="340" y="378" width="560" height="38" rx="10" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <text x="355" y="402" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#4ade80">&#x2713;</text>
  <text x="376" y="402" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d6d3d1">Querying the beanline database</text>
  <text x="862" y="401" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="end">MCP__BEANLINE__QUERY_DATABASE</text>
  <path d="M 874 394 l 5 6 l 5 -6" fill="none" stroke="#78716c" stroke-width="1.8"/>
  <rect x="340" y="424" width="560" height="38" rx="10" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <text x="355" y="448" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#4ade80">&#x2713;</text>
  <text x="376" y="448" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d6d3d1">Querying the beanline database</text>
  <text x="862" y="447" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="end">MCP__BEANLINE__QUERY_DATABASE</text>
  <path d="M 874 440 l 5 6 l 5 -6" fill="none" stroke="#78716c" stroke-width="1.8"/>
  <rect x="340" y="474" width="560" height="136" rx="10" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <line x1="340" y1="510" x2="900" y2="510" stroke="#292524" stroke-width="1"/>
  <text x="356" y="497" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f87171">&#x2715;</text>
  <text x="376" y="497" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d6d3d1">Remove the raw sales.csv file</text>
  <text x="884" y="496" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="end">BASH</text>
  <rect x="352" y="518" width="536" height="96" rx="6" fill="#292524"/><text x="358" y="532" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d6d3d1" xml:space="preserve">$ rm sales.csv</text>
  <text x="358" y="551" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#f87171" xml:space="preserve">Blocked by policy: rm is never allowed in this</text>
  <text x="358" y="570" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#f87171" xml:space="preserve">workspace. If something needs to go, move it into a</text>
  <text x="358" y="589" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#f87171" xml:space="preserve">.trash/ folder and say so in your reply.</text>
  
  <text x="340" y="641" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e7e5e4">Your Q2 grew 11.3% ($584,102.80 to $650,207.40), well ahead of</text>
  <text x="340" y="665" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e7e5e4">the market's 6.8%. I could not delete sales.csv: workspace policy</text>
  <text x="340" y="689" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e7e5e4">blocks rm. Want me to move it into .trash/ instead?</text>
  <text x="340" y="720" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#78716c">$0.0513 · 12s   ·   audit.jsonl: ok fetch, ok query ×2, blocked rm</text>
