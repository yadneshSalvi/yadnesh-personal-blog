  <text x="466" y="798" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="middle">PLAN FIRST</text>
  <rect x="524" y="782" width="108" height="24" rx="8" fill="none" stroke="#292524" stroke-width="1.5"/>
  <text x="578" y="798" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="middle">THINKING OFF</text>
  <rect x="340" y="826" width="46" height="42" rx="12" fill="none" stroke="#292524" stroke-width="1.5"/>
  <text x="363" y="853" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#78716c" text-anchor="middle">+</text>
  <rect x="396" y="826" width="500" height="42" rx="12" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <text x="412" y="852" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#78716c">Ask about your data&#8230;</text>
