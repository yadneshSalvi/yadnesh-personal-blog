  <rect x="340" y="130" width="560" height="78" rx="10" fill="#292524" stroke="#292524" stroke-width="1"/>
  <text x="354" y="152" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#78716c">Which two stores would you like to compare?</text>
