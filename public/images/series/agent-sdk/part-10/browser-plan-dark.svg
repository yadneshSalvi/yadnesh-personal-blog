  <text x="356" y="429" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#d6d3d1">1. Query database for sales volume by store (total units, date range)</text>
  <text x="356" y="450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#d6d3d1">2. Calculate per-category sales breakdown for each store</text>
  <text x="356" y="471" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#d6d3d1">3. Compute daily averages and growth trends</text>
  <text x="356" y="492" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#d6d3d1">4. Generate visualization: time-series line chart or bar comparison</text>
  <text x="356" y="513" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#d6d3d1">5. Write findings to report.md with headline, metrics table, and</text>
  <text x="356" y="534" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#d6d3d1">   interpretation</text>
