  <rect x="532" y="782" width="85" height="21" rx="6" fill="#f5f5f4" stroke="#e7e5e4"/>
  <text x="541" y="796.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#78716c">stores.csv</text>
