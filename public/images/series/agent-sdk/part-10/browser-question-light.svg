  <text x="354" y="614" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1c1917">What's the most important metric for this comparison?</text>
  <rect x="354" y="626" width="152" height="26" rx="13" fill="none" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="430" y="643.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534e" text-anchor="middle">Revenue performance</text>
  <rect x="514" y="626" width="106" height="26" rx="13" fill="#b3441a" stroke="#b3441a" stroke-width="1.5"/>
  <text x="567" y="643.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle">Sales volume</text>
  <rect x="628" y="626" width="145" height="26" rx="13" fill="none" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="700.5" y="643.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534e" text-anchor="middle">Overall comparison</text>
  <rect x="781" y="626" width="59" height="26" rx="13" fill="none" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="810.5" y="643.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534e" text-anchor="middle">Other</text>
  <rect x="354" y="668" width="118" height="30" rx="9" fill="#b3441a" opacity="0.45"/>
  <text x="413" y="688" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff" text-anchor="middle">Send answers</text>
