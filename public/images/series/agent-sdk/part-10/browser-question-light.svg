  <line x1="220" y1="102" x2="220" y2="906" stroke="#e7e5e4" stroke-width="1"/>
  <rect x="14" y="116" width="192" height="36" rx="9" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
