  <text x="355" y="324" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#15803d">&#x2713;</text>
  <text x="376" y="324" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57534e">Reading the beanline schema</text>
  <text x="862" y="323" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#a8a29e" text-anchor="end">MCP__BEANLINE__GET_SCHEMA</text>
  <path d="M 874 316 l 5 6 l 5 -6" fill="none" stroke="#a8a29e" stroke-width="1.8"/>
  <rect x="340" y="346" width="560" height="38" rx="10" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="355" y="370" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#15803d">&#x2713;</text>
  <text x="376" y="370" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57534e">Querying the beanline database</text>
  <text x="862" y="369" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#a8a29e" text-anchor="end">MCP__BEANLINE__QUERY_DATABASE</text>
  <path d="M 874 362 l 5 6 l 5 -6" fill="none" stroke="#a8a29e" stroke-width="1.8"/>
  
  <text x="340" y="413" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"  fill="#1c1917">Great! We have 6 stores. Now let me clarify which two stores you'd like</text>
  <text x="340" y="437" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"  fill="#1c1917">to compare and what aspects matter most to you.</text>
  <rect x="340" y="456" width="560" height="256" rx="10" fill="#ffffff" stroke="#b3441a" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="340" y1="492" x2="900" y2="492" stroke="#e7e5e4" stroke-width="1"/>
  <circle cx="358" cy="474" r="4.5" fill="#b3441a"/>
