  <text x="466" y="545.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534e" text-anchor="middle">Downtown vs Airport (Portland)</text>
  <rect x="586" y="528" width="297" height="26" rx="13" fill="#b3441a" stroke="#b3441a" stroke-width="1.5"/>
  <text x="734.5" y="545.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffffff" text-anchor="middle">Downtown vs University (oldest locations)</text>
  <rect x="354" y="562" width="277" height="26" rx="13" fill="none" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="492.5" y="579.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57534e" text-anchor="middle">Harborview vs Riverside (newer stores)</text>
  <rect x="639" y="562" width="92" height="26" rx="13" fill="none" stroke="#e7e5e4" stroke-width="1.5"/>
