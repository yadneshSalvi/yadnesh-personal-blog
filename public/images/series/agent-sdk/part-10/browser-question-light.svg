  <rect x="10" y="166" width="200" height="44" rx="9" fill="#f5f5f4"/>
  <text x="20" y="185" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1c1917">Prepare a performance report c…</text>
  <text x="20" y="201" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#a8a29e">14s ago</text>
  
  <rect x="512" y="130" width="468" height="40" rx="18" fill="#1c1917"/>
  <text x="529" y="155" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#fafaf9">Prepare a performance report comparing two of our stores.</text>
  <circle cx="345" cy="194" r="3.5" fill="#a8a29e"/>
  <text x="356" y="198" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#a8a29e">THOUGHT FOR 293 WORDS  <tspan fill="#e7e5e4">&#9656;</tspan></text>
  
  <text x="340" y="233" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"  fill="#1c1917">I'll help you prepare a performance report comparing two stores. Let me</text>
  <text x="340" y="257" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"  fill="#1c1917">first explore the available data, then I'll ask you which two you'd like to</text>
  <text x="340" y="281" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"  fill="#1c1917">compare and what metrics matter most to you.</text>
