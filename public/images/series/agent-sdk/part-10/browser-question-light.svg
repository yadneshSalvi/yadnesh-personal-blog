  <rect x="418" y="804" width="96" height="24" rx="8" fill="#b3441a"/>
  <text x="379" y="820" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#a8a29e" text-anchor="middle">ANSWER</text>
  <text x="466" y="820" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#ffffff" text-anchor="middle">PLAN FIRST</text>
  <rect x="524" y="804" width="108" height="24" rx="8" fill="none" stroke="#b3441a" stroke-width="1.5"/>
  <text x="578" y="820" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#b3441a" text-anchor="middle">THINKING ON</text>
  <text x="646" y="820.5" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a8a29e">Read-only: the analyst proposes before it touches anything.</text>
  <rect x="340" y="848" width="46" height="42" rx="12" fill="none" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="363" y="875" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#a8a29e" text-anchor="middle">+</text>
  <rect x="396" y="848" width="500" height="42" rx="12" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="412" y="874" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#a8a29e">Ask about your data&#8230;</text>
  <rect x="906" y="848" width="74" height="42" rx="12" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-opacity="0.7"/>
