  <text x="489" y="164" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#ebe7df">translate(stream)</text>
  <text x="489" y="194" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#a49c90">SDK messages in, envelopes out</text>
