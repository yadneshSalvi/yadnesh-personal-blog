<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700">
  <rect width="1240" height="700" fill="#151311"/>
  <text x="60" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#756d62">ONE REQUEST, END TO END &#183; POST /chat</text>

  
  <rect x="60" y="96" width="330" height="130" rx="14" fill="#1d1a17" stroke="#2b2723" stroke-width="1.5"/>
