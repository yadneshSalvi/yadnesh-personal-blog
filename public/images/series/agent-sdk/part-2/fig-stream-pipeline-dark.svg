  <text x="637.2" y="393" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#756d62">S01 51319.6…</text>
  <rect x="803.6" y="348" width="168" height="58" rx="9" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/>
  <text x="815.6" y="372" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#e5825a">text_delta</text>
  <text x="815.6" y="393" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#756d62">"**Downtown**"</text>
  <rect x="982" y="348" width="168" height="58" rx="9" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/>
  <text x="994" y="372" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#a3c57d">complete</text>
  <text x="994" y="393" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#756d62">$0.0216</text>
  <line x1="76" y1="432" x2="1164" y2="432" stroke="#2b2723" stroke-width="1.5" stroke-dasharray="10 7"/>
  <text x="60" y="466" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#756d62">THE BELT &#183; ONE CONVEYOR, LABELED PARCELS</text>

  <!-- client -->
  <line x1="620" y1="480" x2="620" y2="518" stroke="#e5825a" stroke-width="3"/>
  <path d="M 612 516 L 628 516 L 620 530 Z" fill="#e5825a"/>
  <rect x="340" y="536" width="560" height="74" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/>
  <text x="620" y="566" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#ebe7df" text-anchor="middle">THE CLIENT &#183; curl -N today, the browser in Part 3</text>
  <text x="620" y="592" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#a49c90" text-anchor="middle">switches on "type", ignores labels it doesn't know yet</text>

  <text x="60" y="672" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#ebe7df">Twelve more parts will add parcels. <tspan font-style="italic" fill="#e5825a">Nobody ever rebuilds the belt.</tspan></text>
</svg>