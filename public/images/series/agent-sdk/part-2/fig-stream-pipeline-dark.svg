  <text x="894" y="164" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#ebe7df">StreamingResponse</text>
  <text x="894" y="194" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#a49c90">text/event-stream, held open</text>

