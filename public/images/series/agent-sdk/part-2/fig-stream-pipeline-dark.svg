  <rect x="446.8" y="348" width="168" height="58" rx="9" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/>
  <text x="458.8" y="372" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#e5825a">tool_use_start</text>
  <text x="458.8" y="393" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#756d62">Bash &#183; awk …</text>
  <rect x="625.2" y="348" width="168" height="58" rx="9" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/>
