  <line x1="1035" y1="226" x2="1035" y2="316" stroke="#a49c90" stroke-width="2.5"/>
  <path d="M 1028 314 L 1042 314 L 1035 326 Z" fill="#a49c90"/>
  <text x="1019" y="290" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#756d62" text-anchor="end">data: {"type": …}\n\n</text>

  <!-- the belt -->
  <rect x="60" y="330" width="1120" height="86" rx="12" fill="#1d1a17" stroke="#2b2723" stroke-width="1.5"/>
  
  <rect x="90" y="348" width="168" height="58" rx="9" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/>
