<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700">
  <rect width="1240" height="700" fill="#151311"/>
  <text x="56" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#756d62">THE SAME QUESTION, TWICE &#183; report.md VERBATIM FROM BOTH RUNS</text>
  <text x="56" y="96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="start" xml:space="preserve">THE PART 10 PROMPT ALONE &#183; $0.0358 / 20s</text><rect x="56" y="110" width="520" height="470" rx="10" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/><text x="84" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ebe7df">March 2026 Store Performance</text><text x="84" y="186" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#a49c90">Downtown Portland led all locations with $51.3K</text><text x="84" y="206" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#f0a8a8">revenue, 38% above the chain average.</text><text x="84" y="238" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#a49c90" text-anchor="start" xml:space="preserve">| Store      | City     | Revenue    | Units  |</text><text x="84" y="256" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#a49c90" text-anchor="start" xml:space="preserve">| Downtown   | Portland | $51,319.60 | 12,370 |</text><text x="84" y="274" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#a49c90" text-anchor="start" xml:space="preserve">| Airport    | Portland | $43,425.90 | 10,518 |</text><text x="84" y="292" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#a49c90" text-anchor="start" xml:space="preserve">| …          | …        | …          | …      |</text><text x="84" y="310" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#a49c90" text-anchor="start" xml:space="preserve">| Riverside  | Bend     | $24,676.50 |  6,026 |</text><text x="84" y="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#a49c90">Portland captured two of the top three spots</text><text x="84" y="360" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#a49c90">(Downtown and Airport), combining for $94.7K.</text><text x="84" y="380" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#a49c90">The Seattle location (Harborview) was the</text><text x="84" y="400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#a49c90">strongest non-Portland performer. All stores</text><text x="84" y="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#a49c90">operated the full 31 days in March with no gaps.</text><text x="84" y="456" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5"  fill="#756d62">Fine, as far as it goes. Nothing says what was</text><text x="84" y="473" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5"  fill="#756d62">checked, what to distrust, or who signed it.</text><text x="84" y="498" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5"  fill="#f0a8a8">And "38% above the chain average" is wrong:</text><text x="84" y="515" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5"  fill="#f0a8a8">the real figure is 48.9%. Nobody caught it.</text><text x="660" y="96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#e5825a" text-anchor="start" xml:space="preserve">WITH beanline-report ON THE DESK &#183; $0.0277 / 13s</text><rect x="660" y="110" width="520" height="452" rx="10" fill="#211e1a" stroke="#2b2723" stroke-width="1.5"/><text x="1168" y="147" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#e5825a" text-anchor="end">the title line</text><text x="688" y="148" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ebe7df">Beanline analysis: March 2026 store performance</text><text x="1168" y="181" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#e5825a" text-anchor="end">one sentence, one number</text><text x="688" y="182" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ebe7df">TL;DR: Downtown Portland dominated March 2026</text><text x="688" y="202" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#ebe7df">with $51,319.60 in revenue, nearly 20% ahead of</text><text x="688" y="222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#ebe7df">the second-place Airport location.</text><text x="1168" y="251" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#e5825a" text-anchor="end">currency per the skill</text><text x="688" y="252" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e5825a">Key numbers</text><text x="688" y="274" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#a49c90" text-anchor="start" xml:space="preserve">| Store    | City     | Units  | Revenue    |</text><text x="688" y="292" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#a49c90" text-anchor="start" xml:space="preserve">| Downtown | Portland | 12,370 | $51,319.60 |</text><text x="688" y="310" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#a49c90" text-anchor="start" xml:space="preserve">| …        | …        | …      | …          |</text><text x="1168" y="337" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#e5825a" text-anchor="end">a colleague could redo it</text><text x="688" y="338" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e5825a">How this was computed</text><text x="688" y="360" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#a49c90" text-anchor="start" xml:space="preserve">- Database query: SELECT store_id, name, city,</text><text x="688" y="378" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#a49c90" text-anchor="start" xml:space="preserve">  SUM(units), SUM(revenue) … GROUP BY store</text><text x="1168" y="405" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#e5825a" text-anchor="end">mandatory, always present</text><text x="688" y="406" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e5825a">Caveats</text><text x="688" y="428" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#a49c90">- Portland stores (3 of 6) account for 63% of</text><text x="688" y="448" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#a49c90">  total company revenue, concentrated in one</text><text x="688" y="468" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#a49c90">  market</text><text x="688" y="488" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#a49c90">- No day-to-day variance shown; spike or drop</text><text x="688" y="508" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#a49c90">  detection would require daily granularity</text><text x="1168" y="537" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#e5825a" text-anchor="end">the sign-off, exactly</text><text x="688" y="538" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" font-style="italic" fill="#a49c90">Prepared by the Beanline analyst.</text><text x="688" y="606" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12"  fill="#a49c90">The format is exact. And the caveat still says "63%": the skill fixed the</text><text x="688" y="624" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12"  fill="#a49c90">structure, not the arithmetic. The true share is 59.0%. That is the</text><text x="688" y="642" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12"  fill="#a49c90">reviewer's job, one section from now.</text><text x="56" y="646" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#ebe7df">A skill is knowledge you'd otherwise</text><text x="56" y="674" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#ebe7df">stuff into <tspan font-style="italic" fill="#e5825a">every prompt</tspan>.</text>
</svg>