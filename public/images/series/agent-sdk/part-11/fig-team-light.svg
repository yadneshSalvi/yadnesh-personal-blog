<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="950" viewBox="0 0 1240 950">
  <rect width="1240" height="950" fill="#faf9f6"/>
  <text x="56" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#8f887a">DELEGATION ANATOMY &#183; REAL RUNS &#183; 2026-07-04</text>
  <text x="56" y="96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8f887a" text-anchor="start" xml:space="preserve">THE ANALYST'S CONTEXT</text><rect x="56" y="110" width="500" height="244" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="80" y="140" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f1c19" text-anchor="start">the claude_code preset + ten parts' worth of house rules</text><text x="80" y="162" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f1c19" text-anchor="start">the whole conversation so far</text><text x="80" y="184" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f1c19" text-anchor="start">every number it already computed, and believes</text><line x1="80" y1="204" x2="532" y2="204" stroke="#e7e3d9" stroke-width="1"/><text x="80" y="228" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">Ask THIS context to "double-check your work" and it</text><text x="80" y="246" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">re-reads its own reasoning, nods along, and agrees</text><text x="80" y="264" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">with itself. The literature calls it anchoring.</text><text x="80" y="292" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8f887a" text-anchor="start">Part 6: two wrong hand-summed totals. Part 7: a take</text><text x="80" y="309" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8f887a" text-anchor="start">discarded for volunteering "63%" (true 57.8%). Today:</text><text x="80" y="326" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8f887a" text-anchor="start">"63%" again (true 59.0%) and "38%" (true 48.9%).</text><text x="684" y="96" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#b3441a" text-anchor="start" xml:space="preserve">THE REVIEWER'S CONTEXT (FRESH)</text><rect x="684" y="110" width="500" height="244" rx="12" fill="#f6e7df" stroke="#dcb09a" stroke-width="1.5" /><text x="708" y="140" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f1c19" text-anchor="start">AgentDefinition.prompt: its own rules, its own</text><text x="708" y="160" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f1c19" text-anchor="start">grounding rule, its own mandatory checklist</text><text x="708" y="184" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f1c19" text-anchor="start">the delegation brief. Nothing else arrives.</text><line x1="708" y1="204" x2="1160" y2="204" stroke="#dcb09a" stroke-width="1"/><text x="708" y="228" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start" xml:space="preserve">tools=["Read", "Glob", "Grep",</text><text x="708" y="246" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start" xml:space="preserve">       "mcp__beanline__query_database",</text><text x="708" y="264" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start" xml:space="preserve">       "mcp__beanline__get_schema"]</text><text x="708" y="292" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">No Bash. No Write. It cannot change a byte, so nothing</text><text x="708" y="310" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">it does raises an approval card. Its skepticism is</text><text x="708" y="328" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">structural: it never saw the analyst's working.</text><line x1="306" y1="354" x2="306" y2="396" stroke="#8f887a" stroke-width="1.6"/><path d="M 302 388 l 4 8 l 4 -8" fill="none" stroke="#8f887a" stroke-width="1.6"/><rect x="160" y="396" width="700" height="96" rx="12" fill="#ffffff" stroke="#dcb09a" stroke-width="1.5" /><text x="184" y="424" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#b3441a" text-anchor="start" xml:space="preserve">ToolUseBlock  name="Agent"   (the Task tool at work; engine-approved)</text><text x="184" y="448" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start" xml:space="preserve">{"subagent_type": "reviewer", "description": "Verify March 2026 total revenue",</text><text x="184" y="466" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start" xml:space="preserve"> "prompt": "The analyst reports $206,815.80 for March 2026. Re-derive it…"}</text><line x1="860" y1="444" x2="934" y2="444" stroke="#b3441a" stroke-width="1.6"/><path d="M 926 440 l 8 4 l -8 4" fill="#b3441a"/><rect x="934" y="408" width="250" height="72" rx="12" fill="#f6e7df" stroke="#dcb09a" stroke-width="1.5" /><text x="950" y="434" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b554c" text-anchor="start">a fresh session boots with</text><text x="950" y="450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b554c" text-anchor="start">ONLY the brief and the</text><text x="950" y="466" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b554c" text-anchor="start">AgentDefinition prompt</text><text x="56" y="528" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8f887a" text-anchor="start" xml:space="preserve">WHAT RIDES THE STREAM WHILE IT WORKS</text><rect x="56" y="540" width="700" height="118" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="80" y="568" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#1f1c19" text-anchor="start" xml:space="preserve">AssistantMessage  parent_tool_use_id="toolu_01M2kutG…"  &lt;- the Agent call</text><text x="80" y="590" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start" xml:space="preserve">  ToolUseBlock  mcp__beanline__query_database  {"sql": "SELECT date, store_id,</text><text x="80" y="608" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#5b554c" text-anchor="start" xml:space="preserve">   product_id, COUNT(*) … GROUP BY … HAVING cnt > 1"}   the duplicate hunt</text><text x="80" y="632" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#1f1c19" text-anchor="start" xml:space="preserve">UserMessage (its tool results)  parent_tool_use_id="toolu_01M2kutG…"</text><line x1="756" y1="596" x2="830" y2="596" stroke="#8f887a" stroke-width="1.4"/><rect x="830" y="552" width="354" height="94" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="846" y="578" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b554c" text-anchor="start">the translator forwards it as</text><text x="846" y="598" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#b3441a" text-anchor="start" xml:space="preserve">parent_tool_id</text><text x="846" y="618" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b554c" text-anchor="start">and the UI nests the badge. One</text><text x="846" y="634" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5b554c" text-anchor="start">optional field, zero new parcels.</text><text x="56" y="704" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8f887a" text-anchor="start" xml:space="preserve">WHAT COMES BACK</text><rect x="56" y="716" width="1128" height="96" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="80" y="744" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f1c19" text-anchor="start">The Agent call's tool_result IS the reviewer's report: each figure confirmed or corrected, the duplicate</text><text x="80" y="762" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f1c19" text-anchor="start">flagged with its query evidence. The CLI appends a receipt trailer, straight from the real run:</text><text x="80" y="790" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#3f6212" text-anchor="start" xml:space="preserve">&lt;usage&gt;subagent_tokens: 5558   tool_uses: 8   duration_ms: 23635&lt;/usage&gt;</text><text x="56" y="878" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f1c19">You cannot anchor a colleague</text><text x="56" y="906" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f1c19">who never saw <tspan font-style="italic" fill="#b3441a">your working</tspan>.</text><text x="684" y="872" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">The premium, measured on the same question: $0.0095 alone,</text><text x="684" y="890" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">$0.0365 with the review (8 reviewer tool calls, 31s). What the</text><text x="684" y="908" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">review bought: a duplicated row and a wrong percentage, caught.</text>
</svg>