ce="preserve">artifact_update</text><text x="484" y="324" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#a49c90" text-anchor="start" xml:space="preserve">4</text><text x="556" y="324" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49c90" text-anchor="start" xml:space="preserve">path, kind, size</text><text x="76" y="358" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ebe7df" text-anchor="start" xml:space="preserve">approval_request / _resolved</text><text x="484" y="358" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#a49c90" text-anchor="start" xml:space="preserve">7</text><text x="556" y="358" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49c90" text-anchor="start" xml:space="preserve">approval_id, tool, input / decision</text><rect x="56" y="372" width="1128" height="34" rx="6" fill="#1d1a17"/><text x="76" y="392" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ebe7df" text-anchor="start" xml:space="preserve">(SSE id: field)</text><text x="484" y="392" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#a49c90" text-anchor="start" xml:space="preserve">9</text><text x="556" y="392" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49c90" text-anchor="start" xml:space="preserve">request_id:seq, enables replay + Last-Event-ID</text><text x="76" y="426" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ebe7df" text-anchor="start" xml:space="preserve">thinking_delta</text><text x="484" y="426" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#a49c90" text-anchor="start" xml:space="preserve">10</text><text x="556" y="426" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49c90" text-anchor="start" xml:space="preserve">text</text><rect x="56" y="440" width="1128" height="34" rx="6" fill="#1d1a17"/><text x="76" y="460" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ebe7df" text-anchor="start" xml:space="preserve">plan_proposed</text><text x="484" y="460" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#a49c90" text-anchor="start" xml:space="preserve">10</text><text x="556" y="460" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49c90" text-anchor="start" xml:space="preserve">plan_id, markdown</text><text x="76" y="494" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ebe7df" text-anchor="start" xml:space="preserve">question_request / _resolved</text><text x="484" y="494" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#a49c90" text-anchor="start" xml:space="preserve">10</text><text x="556" y="494" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#a49c90" text-anchor="start" xml:space="preserve">question_id, questions / answers</text><text x="56" y="558" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"  fill="#a49c90" text-anchor="start">Six types in Part 2. Six more types, one envelope field, and three optional payload fields since. Zero changes to any</text><text x="56" y="580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"  fill="#a49c90" text-anchor="start">type ever shipped, and the Part 3 parser (switch on type, ignore what you don't know) never needed an update.</text><text x="56" y="636" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#ebe7df">Eleven parts of features rode one envelope.</text><text x="56" y="666" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#ebe7df">The vocabulary is <tspan font-style="italic" fill="#e5825a">finished</tspan>. The parser never changed.</text>
