<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620">
  <rect width="1240" height="620" fill="#151311"/>
  <text x="56" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#756d62">WHERE A TOOL LIVES &#183; THE SAME PROTOCOL EITHER WAY</text>
  <text x="56" y="106" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2.5" fill="#e5825a">THIS PART &#183; IN-PROCESS</text><rect x="56" y="122" width="520" height="320" rx="12" fill="none" stroke="#5e463a" stroke-width="1.5" stroke-dasharray="7 5"/><text x="76" y="150" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="start" xml:space="preserve">your FastAPI process</text><rect x="88" y="174" width="200" height="96" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5" /><text x="188" y="206" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ebe7df" text-anchor="middle">the agent loop</text><text x="188" y="228" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="middle" xml:space="preserve">query() / SDK</text><text x="188" y="250" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="middle" xml:space="preserve">toolbox: Read, Bash, &#8230;</text><rect x="340" y="174" width="208" height="130" rx="12" fill="#211e1a" stroke="#5e463a" stroke-width="1.5" /><text x="444" y="200" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#e5825a" text-anchor="middle" xml:space="preserve">beanline</text><text x="444" y="224" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a49c90" text-anchor="middle">an MCP server that is</text><text x="444" y="242" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a49c90" text-anchor="middle">two Python functions</text><text x="444" y="268" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#ebe7df" text-anchor="middle" xml:space="preserve">query_database(sql)</text><text x="444" y="288" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#ebe7df" text-anchor="middle" xml:space="preserve">get_schema()</text><line x1="288" y1="222" x2="332" y2="222" stroke="#a49c90" stroke-width="2"/>
  <path d="M 332 215 L 332 229 L 344 222 Z" fill="#a49c90"/><text x="316" y="206" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#756d62" text-anchor="middle">a function call</text><text x="76" y="352" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ebe7df" text-anchor="start" xml:space="preserve">server = create_sdk_mcp_server(name="beanline",</text><text x="76" y="372" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ebe7df" text-anchor="start" xml:space="preserve">                               tools=[query_database, get_schema])</text><text x="76" y="400" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#756d62" text-anchor="start" xml:space="preserve">mcp_servers={"beanline": server}   # no subprocess, no network</text><text x="660" y="106" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2.5" fill="#756d62">PART 12 &#183; EXTERNAL (SOMEONE ELSE'S CODE)</text><rect x="660" y="122" width="524" height="148" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5" /><text x="680" y="150" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ebe7df" text-anchor="start" xml:space="preserve">stdio server</text><text x="680" y="172" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a49c90" text-anchor="start">a subprocess the SDK spawns and speaks MCP to over pipes</text><text x="680" y="198" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="start" xml:space="preserve">{"command": "npx", "args": ["-y", "some-mcp-server"]}</text><text x="680" y="224" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="start" xml:space="preserve">+ its own language, runtime, dependencies, crashes</text><rect x="660" y="294" width="524" height="148" rx="12" fill="#211e1a" stroke="#2b2723" stroke-width="1.5" /><text x="680" y="322" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#ebe7df" text-anchor="start" xml:space="preserve">HTTP server</text><text x="680" y="344" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a49c90" text-anchor="start">a remote service; MCP over HTTP, credentials in headers</text><text x="680" y="370" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#756d62" text-anchor="start" xml:space="preserve">{"type": "http", "url": "https://mcp.example.com", &#8230;}</text><text x="680" y="396" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#756d62" text-anchor="start" xml:space="preserve">+ the network, auth, and someone else's uptime</text><rect x="56" y="486" width="1128" height="92" rx="12" fill="#2a201a" stroke="#5e463a" stroke-width="1.5" /><text x="76" y="516" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="2" fill="#e5825a">THE NAMING RULE &#183; EVERY MCP TOOL, LOCAL OR REMOTE</text><text x="76" y="546" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#ebe7df" text-anchor="start" xml:space="preserve">mcp__beanline__query_database</text><text x="416" y="546" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#a49c90" text-anchor="start" xml:space="preserve">=  mcp__&lt;server key&gt;__&lt;tool name&gt;</text><text x="76" y="568" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#756d62" text-anchor="start">The server key is whatever string you used in mcp_servers={...}. Permission rules match on this full name.</text>
</svg>