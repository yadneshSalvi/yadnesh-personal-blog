  <rect x="340" y="745" width="46" height="42" rx="12" fill="none" stroke="#292524" stroke-width="1.5"/>
  <text x="363" y="772" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#78716c" text-anchor="middle">+</text>
  <rect x="396" y="745" width="500" height="42" rx="12" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <text x="412" y="771" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#78716c">Ask about your data&#8230;</text>
