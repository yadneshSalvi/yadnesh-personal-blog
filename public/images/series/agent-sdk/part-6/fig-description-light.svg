<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520">
  <rect width="1240" height="520" fill="#faf9f6"/>
  <text x="56" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#8f887a">SAME QUESTION &#183; SAME DATA &#183; ONLY THE DESCRIPTION CHANGED &#183; BOTH RUNS REAL</text>
  <text x="56" y="104" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2.5" fill="#8f887a">DESCRIPTION NAMES ONLY THE TABLES</text><rect x="56" y="120" width="556" height="290" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5"/><text x="80" y="152" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#1f1c19" xml:space="preserve">"&#8230; Tables: stores, products, sales."</text><line x1="80" y1="172" x2="588" y2="172" stroke="#e7e3d9" stroke-width="1"/><text x="80" y="196" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#5b554c" xml:space="preserve">SELECT SUM(&#8230;column5&#8230;)</text><text x="360" y="196" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#b91c1c" xml:space="preserve">&#x2715; no such column: column5</text><text x="80" y="226" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#5b554c" xml:space="preserve">SELECT SUM(price) &#8230;</text><text x="360" y="226" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#b91c1c" xml:space="preserve">&#x2715; no such column: price</text><text x="80" y="256" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#5b554c" xml:space="preserve">SELECT SUM(COLUMN5) &#8230;</text><text x="360" y="256" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#b91c1c" xml:space="preserve">&#x2715; no such column: COLUMN5</text><text x="80" y="286" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#5b554c" xml:space="preserve">PRAGMA table_info(sales)</text><text x="360" y="286" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#3f6212" xml:space="preserve">&#x2713; finally, the columns</text><text x="80" y="316" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#5b554c" xml:space="preserve">SELECT SUM(revenue) &#8230;</text><text x="360" y="316" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#3f6212" xml:space="preserve">&#x2713; 206815.8</text><line x1="80" y1="340" x2="588" y2="340" stroke="#e7e3d9" stroke-width="1"/><text x="80" y="370" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#1f1c19" xml:space="preserve">5 tool calls &#183; $0.0217</text><text x="628" y="104" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="2.5" fill="#b3441a">DESCRIPTION CARRIES THE COLUMNS</text><rect x="628" y="120" width="556" height="290" rx="12" fill="#ffffff" stroke="#dcb09a" stroke-width="1.5"/><text x="652" y="152" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#1f1c19" xml:space="preserve">"&#8230; sales(date, store_id, product_id,</text><text x="652" y="170" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#1f1c19" xml:space="preserve">           units, revenue) &#8230;"</text><line x1="652" y1="190" x2="1160" y2="190" stroke="#e7e3d9" stroke-width="1"/><text x="652" y="220" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#5b554c" xml:space="preserve">SELECT SUM(revenue) FROM sales</text><text x="652" y="238" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#5b554c" xml:space="preserve">WHERE date &gt;= '2026-03-01' &#8230;</text><text x="1000" y="220" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#3f6212" xml:space="preserve">&#x2713; 206815.8</text><line x1="652" y1="340" x2="1160" y2="340" stroke="#e7e3d9" stroke-width="1"/><text x="652" y="370" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#1f1c19" xml:space="preserve">1 tool call &#183; $0.0055</text><text x="652" y="286" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8f887a" xml:space="preserve">(first try, no schema safari)</text><text x="56" y="476" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#1f1c19">The model reads a tool description the way it reads a prompt. <tspan font-style="italic" fill="#b3441a">Because it is one.</tspan></text>
</svg>