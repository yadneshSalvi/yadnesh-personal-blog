<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 90 1280 520">
  <rect width="1280" height="720" fill="#faf9f6"/>

  <!-- cover furniture -->
  
  
  
  

  <!-- the app window -->
  <rect x="64" y="118" width="1152" height="470" rx="12" fill="#f5f5f4" stroke="#e2ded4" stroke-width="1.5"/>
  <path d="M 64 130 a12 12 0 0 1 12,-12 h 1128 a12 12 0 0 1 12,12 v 32 h -1152 z" fill="#f3f1ec"/>
  <line x1="64" y1="162" x2="1216" y2="162" stroke="#e2ded4" stroke-width="1.5"/>
  <circle cx="90" cy="140" r="6" fill="#d6d1c5"/><circle cx="112" cy="140" r="6" fill="#d6d1c5"/><circle cx="134" cy="140" r="6" fill="#d6d1c5"/>
  <rect x="450" y="126" width="380" height="28" rx="14" fill="#ffffff" stroke="#e2ded4"/>
  <text x="640" y="145" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#5b554c" text-anchor="middle">localhost:3000</text>

  <!-- chat column -->
  <rect x="88" y="182" width="610" height="386" rx="12" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="110" y="216" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1c1917">Beanline analyst</text>
  <text x="676" y="216" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#a8a29e" text-anchor="end">WORKING&#8230; 14s</text>
  <line x1="88" y1="232" x2="698" y2="232" stroke="#e7e5e4" stroke-width="1.5"/>

  <!-- user bubble -->
  <rect x="296" y="248" width="380" height="36" rx="12" fill="#1c1917"/>
  <text x="312" y="271" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#fafaf9">Chart monthly revenue by store and write it up.</text>

  <!-- tool badges -->
  <rect x="110" y="298" width="330" height="34" rx="9" fill="none" stroke="#d6d3d1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="124" y="320" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#78716c"><tspan fill="#3f6212">&#10003;</tspan>  <tspan font-weight="700" fill="#1c1917">Read</tspan>  sales.csv &#183; 11,081 rows</text>
  <rect x="110" y="340" width="330" height="34" rx="9" fill="none" stroke="#d6d3d1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="124" y="362" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#78716c"><tspan fill="#3f6212">&#10003;</tspan>  <tspan font-weight="700" fill="#1c1917">Bash</tspan>  python analyze.py</text>

  <!-- approval card, resolved -->
  <rect x="110" y="384" width="440" height="64" rx="10" fill="#f2f7e8" stroke="#3f6212" stroke-width="1.5"/>
  <text x="128" y="410" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#3f6212">APPROVED</text>
  <text x="128" y="433" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#1c1917">Write &#183; report.md</text>
  <text x="524" y="422" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#3f6212" text-anchor="end">&#10003;</text>

  <!-- assistant bubble -->
  <rect x="110" y="464" width="470" height="58" rx="12" fill="#f5f5f4"/>
  <text x="126" y="488" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1917">Downtown leads every month. Full write-up in</text>
  <text x="126" y="509" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1917"><tspan font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13">report.md</tspan>, chart attached.<tspan fill="#b3441a">&#9612;</tspan></text>

  <!-- artifacts panel -->
  <rect x="718" y="182" width="474" height="386" rx="12" fill="#fafaf9" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="740" y="214" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#a8a29e">ARTIFACTS</text>
  <rect x="740" y="230" width="130" height="28" rx="8" fill="#ffffff" stroke="#b3441a" stroke-width="1.5"/>
  <text x="754" y="249" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#b3441a">revenue.png</text>
  <rect x="880" y="230" width="110" height="28" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="894" y="249" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#78716c">report.md</text>

  <!-- the chart artifact -->
  <rect x="740" y="274" width="430" height="164" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="748" y="292" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#a8a29e">Revenue by store &#183; Jan-Jun 2026</text>
  <rect x="748" y="300" width="42" height="120" fill="#b3441a" opacity="1"/>
  <rect x="822.4" y="323" width="42" height="97" fill="#b3441a" opacity="0.55"/>
  <rect x="896.8" y="352" width="42" height="68" fill="#b3441a" opacity="0.55"/>
  <rect x="971.2" y="358" width="42" height="62" fill="#b3441a" opacity="0.55"/>
  <rect x="1045.6" y="343" width="42" height="77" fill="#b3441a" opacity="0.55"/>
  <rect x="1120" y="355" width="42" height="65" fill="#b3441a" opacity="0.55"/>
  <line x1="742" y1="420" x2="1168" y2="420" stroke="#d6d3d1" stroke-width="1.5"/>

  <!-- the report artifact preview -->
  <rect x="740" y="454" width="430" height="86" rx="8" fill="#ffffff" stroke="#e7e5e4" stroke-width="1.5"/>
  <text x="756" y="480" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1c1917">Beanline revenue, H1 2026</text>
  <rect x="756" y="494" width="370" height="7" rx="3.5" fill="#f5f5f4"/>
  <rect x="756" y="510" width="320" height="7" rx="3.5" fill="#f5f5f4"/>
  <rect x="756" y="526" width="350" height="7" rx="3.5" fill="#f5f5f4"/>

  <!-- bottom band: icon row + line -->
  
  
  
  
  
  
</svg>