<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" font-family="'SF Mono', Menlo, Consolas, monospace">
  <rect width="1040" height="480" fill="#1a1816"/>
  <rect width="1040" height="48" fill="#211e1a"/>
  <circle cx="28" cy="24" r="7" fill="#3a3530"/>
  <circle cx="52" cy="24" r="7" fill="#3a3530"/>
  <circle cx="76" cy="24" r="7" fill="#3a3530"/>
  <text x="520" y="30" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#756d62" text-anchor="middle" letter-spacing="1">terminal &#183; backend</text>
  <g font-size="14.5" fill="#d8d2c6">
    <text x="32" y="88" xml:space="preserve"><tspan fill="#756d62">$</tspan> uv run python hello.py</text>
    <text x="32" y="116" xml:space="preserve"></text>
    <text x="32" y="144" xml:space="preserve">SystemMessage(subtype=<tspan fill="#8fb573">'init'</tspan>, data={'session_id': <tspan fill="#e5825a">'8d7bc838-8dd1-45d2-…'</tspan>,</text>
    <text x="32" y="172" xml:space="preserve">  'model': 'claude-fable-5', 'tools': [...], 'cwd': '…/backend', …})</text>
    <text x="32" y="200" xml:space="preserve"></text>
    <text x="32" y="228" xml:space="preserve">AssistantMessage(content=[TextBlock(text=<tspan fill="#8fb573">'12,816'</tspan>)],</text>
    <text x="32" y="256" xml:space="preserve">  model='claude-fable-5', …)</text>
    <text x="32" y="284" xml:space="preserve"></text>
    <text x="32" y="312" xml:space="preserve">ResultMessage(subtype='success', duration_ms=3843, num_turns=1,</text>
    <text x="32" y="340" xml:space="preserve">  <tspan fill="#e5825a">total_cost_usd=0.34184</tspan>, result=<tspan fill="#8fb573">'12,816'</tspan>, …)</text>
    <text x="32" y="368" xml:space="preserve"></text>
    <text x="32" y="396" xml:space="preserve"><tspan fill="#756d62"># it answered. and that bare default billed 34 cents for one</tspan></text>
    <text x="32" y="424" xml:space="preserve"><tspan fill="#756d62"># multiplication. hold that thought: we fix it in two sections.</tspan></text>
  </g>
</svg>