<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#151311"/>

  <!-- cover furniture -->
  <line x1="64" y1="72" x2="1216" y2="72" stroke="#2b2723" stroke-width="1.5"/>
  <line x1="64" y1="648" x2="1216" y2="648" stroke="#2b2723" stroke-width="1.5"/>
  <text x="64" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="19" letter-spacing="3.5" fill="#756d62">SERIES &#183; CLAUDE AGENT SDK IN PRODUCTION</text>
  <text x="1216" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="19" letter-spacing="3.5" fill="#756d62" text-anchor="end">14 PARTS &#183; 3 ACTS</text>

  <!-- the app window -->
  <rect x="64" y="118" width="1152" height="470" rx="12" fill="#0c0a09" stroke="#2b2723" stroke-width="1.5"/>
  <path d="M 64 130 a12 12 0 0 1 12,-12 h 1128 a12 12 0 0 1 12,12 v 32 h -1152 z" fill="#211e1a"/>
  <line x1="64" y1="162" x2="1216" y2="162" stroke="#2b2723" stroke-width="1.5"/>
  <circle cx="90" cy="140" r="6" fill="#3a3530"/><circle cx="112" cy="140" r="6" fill="#3a3530"/><circle cx="134" cy="140" r="6" fill="#3a3530"/>
  <rect x="450" y="126" width="380" height="28" rx="14" fill="#1a1816" stroke="#3a3530"/>
  <text x="640" y="145" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#a49c90" text-anchor="middle">localhost:3000</text>

  <!-- chat column -->
  <rect x="88" y="182" width="610" height="386" rx="12" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <text x="110" y="216" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#fafaf9">Beanline analyst</text>
  <text x="676" y="216" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#78716c" text-anchor="end">WORKING&#8230; 14s</text>
  <line x1="88" y1="232" x2="698" y2="232" stroke="#292524" stroke-width="1.5"/>

  <!-- user bubble -->
  <rect x="296" y="248" width="380" height="36" rx="12" fill="#fafaf9"/>
  <text x="312" y="271" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1c1917">Chart monthly revenue by store and write it up.</text>

  <!-- tool badges -->
  <rect x="110" y="298" width="330" height="34" rx="9" fill="none" stroke="#44403c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="124" y="320" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#a8a29e"><tspan fill="#a3c57d">&#10003;</tspan>  <tspan font-weight="700" fill="#fafaf9">Read</tspan>  sales.csv &#183; 11,081 rows</text>
  <rect x="110" y="340" width="330" height="34" rx="9" fill="none" stroke="#44403c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="124" y="362" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#a8a29e"><tspan fill="#a3c57d">&#10003;</tspan>  <tspan font-weight="700" fill="#fafaf9">Bash</tspan>  python analyze.py</text>

  <!-- approval card, resolved -->
  <rect x="110" y="384" width="440" height="64" rx="10" fill="#1d2314" stroke="#a3c57d" stroke-width="1.5"/>
  <text x="128" y="410" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" fill="#a3c57d">APPROVED</text>
  <text x="128" y="433" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#fafaf9">Write &#183; report.md</text>
  <text x="524" y="422" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#a3c57d" text-anchor="end">&#10003;</text>

  <!-- assistant bubble -->
  <rect x="110" y="464" width="470" height="58" rx="12" fill="#292524"/>
  <text x="126" y="488" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#fafaf9">Downtown leads every month. Full write-up in</text>
  <text x="126" y="509" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#fafaf9"><tspan font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13">report.md</tspan>, chart attached.<tspan fill="#e5825a">&#9612;</tspan></text>

  <!-- artifacts panel -->
  <rect x="718" y="182" width="474" height="386" rx="12" fill="#171412" stroke="#292524" stroke-width="1.5"/>
  <text x="740" y="214" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" letter-spacing="2" fill="#78716c">ARTIFACTS</text>
  <rect x="740" y="230" width="130" height="28" rx="8" fill="#211e1a" stroke="#e5825a" stroke-width="1.5"/>
  <text x="754" y="249" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#e5825a">revenue.png</text>
  <rect x="880" y="230" width="110" height="28" rx="8" fill="#211e1a" stroke="#292524" stroke-width="1.5"/>
  <text x="894" y="249" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#a8a29e">report.md</text>

  <!-- the chart artifact -->
  <rect x="740" y="274" width="430" height="164" rx="8" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <text x="748" y="292" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#78716c">Revenue by store &#183; Jan-Jun 2026</text>
  <rect x="748" y="300" width="42" height="120" fill="#e5825a" opacity="1"/>
  <rect x="822.4" y="323" width="42" height="97" fill="#e5825a" opacity="0.55"/>
  <rect x="896.8" y="352" width="42" height="68" fill="#e5825a" opacity="0.55"/>
