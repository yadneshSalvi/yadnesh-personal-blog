  <rect x="1120" y="355" width="42" height="65" fill="#e5825a" opacity="0.55"/>
  <line x1="742" y1="420" x2="1168" y2="420" stroke="#44403c" stroke-width="1.5"/>

  <!-- the report artifact preview -->
  <rect x="740" y="454" width="430" height="86" rx="8" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <text x="756" y="480" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#fafaf9">Beanline revenue, H1 2026</text>
