  <rect x="396" y="933" width="500" height="42" rx="12" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <text x="412" y="959" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#78716c">Ask about your data&#8230;</text>
