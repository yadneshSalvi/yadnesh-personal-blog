  <text x="455" y="915.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#a8a29e">sales.csv</text>
  <rect x="532" y="901" width="85" height="21" rx="6" fill="#1c1917" stroke="#292524"/>
  <text x="541" y="915.5" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" fill="#a8a29e">stores.csv</text>
