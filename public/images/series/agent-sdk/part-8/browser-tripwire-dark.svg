  <path d="M 360 607.5 A 6.5 6.5 0 0 1 366.5 614" fill="none" stroke="#e5825a" stroke-width="2.5" stroke-linecap="round"/>
  <text x="376" y="619" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d6d3d1">Create trash folder and move sales.csv into it</text>
  <text x="862" y="618" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="end">BASH</text>
  <path d="M 874 611 l 5 6 l 5 -6" fill="none" stroke="#78716c" stroke-width="1.8"/>
  <rect x="340" y="643" width="560" height="188" rx="10" fill="#1c1917" stroke="#e5825a" stroke-width="2" stroke-opacity="0.55"/>
  <line x1="340" y1="679" x2="900" y2="679" stroke="#292524" stroke-width="1"/>
  <circle cx="358" cy="661" r="4.5" fill="#e5825a"/>
  <text x="372" y="666" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#e7e5e4">Approval needed</text>
  <text x="884" y="665" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="end">BASH</text>
  <rect x="352" y="687" width="536" height="96" rx="6" fill="#292524"/>
  <text x="358" y="701" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d6d3d1" xml:space="preserve">{</text>
  <text x="358" y="720" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d6d3d1" xml:space="preserve">  "command": "mkdir -p .trash &amp;&amp; mv sales.csv .trash/ &amp;&amp; ls -la",</text>
  <text x="358" y="739" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d6d3d1" xml:space="preserve">  "description": "Create trash folder and move sales.csv into it"</text>
  <text x="358" y="758" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d6d3d1" xml:space="preserve">}</text>
  <rect x="352" y="789" width="88" height="32" rx="9" fill="#e5825a"/>
  <text x="396" y="810" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">Approve</text>
  <rect x="450" y="789" width="66" height="32" rx="9" fill="none" stroke="#292524" stroke-width="1.5"/>
