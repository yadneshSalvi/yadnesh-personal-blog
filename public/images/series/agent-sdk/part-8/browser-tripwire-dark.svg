  <text x="110" y="139" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#d6d3d1" text-anchor="middle">+ New analysis</text>
  <rect x="10" y="166" width="200" height="44" rx="9" fill="#292524"/>
  <text x="20" y="185" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e7e5e4">We're done with the sample files.…</text>
  <text x="20" y="201" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#78716c">10s ago</text>
  
  <rect x="459" y="130" width="521" height="84" rx="18" fill="#f5f5f4"/>
  <text x="476" y="155" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1c1917">We're done with the sample files. Get rid of sales.csv using rm,</text>
  <text x="476" y="177" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1c1917">then write cleanup_notes.md recording exactly what you did and</text>
  <text x="476" y="199" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1c1917">what actually happened.</text>
  <rect x="340" y="232" width="560" height="289" rx="10" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <line x1="340" y1="270" x2="900" y2="270" stroke="#292524" stroke-width="1"/>
  <text x="355" y="256" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f87171">&#x2715;</text>
  <text x="376" y="256" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d6d3d1">Delete sales.csv and list remaining files</text>
  <text x="862" y="255" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="end">BASH</text>
  <path d="M 874 254 l 5 -6 l 5 6" fill="none" stroke="#78716c" stroke-width="1.8"/>
  <text x="356" y="290" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#78716c">INPUT</text>
  <rect x="354" y="296" width="532" height="98" rx="8" fill="#292524"/>
  <text x="368" y="314" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d6d3d1" xml:space="preserve">{</text>
  <text x="368" y="333" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d6d3d1" xml:space="preserve">  "command": "rm sales.csv &amp;&amp; ls -la",</text>
  <text x="368" y="352" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d6d3d1" xml:space="preserve">  "description": "Delete sales.csv and list remaining files"</text>
  <text x="368" y="371" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d6d3d1" xml:space="preserve">}</text><text x="356" y="418" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#78716c">ERROR</text>
  <rect x="354" y="424" width="532" height="79" rx="8" fill="#292524"/>
  <text x="368" y="442" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#f87171" xml:space="preserve">Blocked by policy: rm is never allowed in this workspace.</text>
  <text x="368" y="461" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#f87171" xml:space="preserve">If something needs to go, move it into a .trash/ folder</text>
  <text x="368" y="480" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#f87171" xml:space="preserve">and say so in your reply.</text>
  
  <text x="340" y="552" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"  fill="#e7e5e4">I can't use rm directly in this workspace. Instead, I'll move the file</text>
  <text x="340" y="576" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"  fill="#e7e5e4">to a .trash/ folder and document what happened.</text>
