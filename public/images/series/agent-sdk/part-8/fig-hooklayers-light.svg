<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880">
  <rect width="1240" height="880" fill="#faf9f6"/>
  <text x="56" y="52" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="13" letter-spacing="2.5" fill="#8f887a">THE HOOK LAYER &#183; ONE AGENT TURN, EVERY INTERCEPTION POINT</text>
  <rect x="56" y="96" width="660" height="54" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="76" y="118" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#1f1c19" text-anchor="start" xml:space="preserve">your prompt arrives</text><text x="76" y="138" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8f887a" text-anchor="start">POST /chat, one turn begins</text><line x1="176" y1="150" x2="176" y2="170" stroke="#5b554c" stroke-width="2"/><path d="M 176 178 L 170 166 L 182 166 Z" fill="#5b554c"/><rect x="56" y="178" width="660" height="72" rx="12" fill="#f6e7df" stroke="#dcb09a" stroke-width="1.5" /><text x="76" y="202" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#b3441a" text-anchor="start" xml:space="preserve">HOOK &#183; UserPromptSubmit</text><text x="76" y="222" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">can append context the model will read as part of the prompt.</text><text x="76" y="240" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">Ours injects the desk's file list and today's date.</text><line x1="176" y1="250" x2="176" y2="270" stroke="#5b554c" stroke-width="2"/><path d="M 176 278 L 170 266 L 182 266 Z" fill="#5b554c"/><rect x="56" y="278" width="660" height="54" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="76" y="300" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#1f1c19" text-anchor="start" xml:space="preserve">the model decides on a tool call</text><text x="76" y="320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8f887a" text-anchor="start">ToolUseBlock: Bash, rm sales.csv &amp;&amp; ls -la</text><line x1="176" y1="332" x2="176" y2="352" stroke="#5b554c" stroke-width="2"/><path d="M 176 360 L 170 348 L 182 348 Z" fill="#5b554c"/><rect x="56" y="360" width="660" height="90" rx="12" fill="#f6e7df" stroke="#dcb09a" stroke-width="1.5" /><text x="76" y="384" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#b3441a" text-anchor="start" xml:space="preserve">HOOK &#183; PreToolUse</text><text x="76" y="404" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">sees every call, first, before any permission machinery. May deny</text><text x="76" y="422" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">with a reason the model reads. A deny ends the story right here:</text><text x="76" y="440" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">no gauntlet, no card, no human, no tool.</text><line x1="176" y1="450" x2="176" y2="470" stroke="#5b554c" stroke-width="2"/><path d="M 176 478 L 170 466 L 182 466 Z" fill="#5b554c"/><rect x="56" y="478" width="660" height="72" rx="12" fill="none" stroke="#e7e3d9" stroke-width="1.5" stroke-dasharray="7 5"/><text x="76" y="502" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#8f887a" text-anchor="start" xml:space="preserve">PART 7'S GAUNTLET (gates 2-5)</text><text x="76" y="522" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8f887a" text-anchor="start">engine judgment, allowed_tools, permission_mode, can_use_tool.</text><text x="76" y="540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#8f887a" text-anchor="start">Only calls the hook let through ever get here.</text><line x1="176" y1="550" x2="176" y2="570" stroke="#5b554c" stroke-width="2"/><path d="M 176 578 L 170 566 L 182 566 Z" fill="#5b554c"/><rect x="56" y="578" width="660" height="54" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="76" y="600" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#1f1c19" text-anchor="start" xml:space="preserve">the tool runs</text><text x="76" y="620" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8f887a" text-anchor="start">for real: files change, queries run</text><line x1="176" y1="632" x2="176" y2="652" stroke="#5b554c" stroke-width="2"/><path d="M 176 660 L 170 648 L 182 648 Z" fill="#5b554c"/><rect x="56" y="660" width="660" height="90" rx="12" fill="#f6e7df" stroke="#dcb09a" stroke-width="1.5" /><text x="76" y="684" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#b3441a" text-anchor="start" xml:space="preserve">HOOK &#183; PostToolUse / PostToolUseFailure</text><text x="76" y="704" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">fire after the outcome, with the same tool_use_id as the badge in</text><text x="76" y="722" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">your UI. Ours append one JSONL line each: the audit log.</text><text x="76" y="740" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#b91c1c" text-anchor="start">Verified gotcha: a hook-denied call never reaches these two.</text><line x1="176" y1="750" x2="176" y2="770" stroke="#5b554c" stroke-width="2"/><path d="M 176 778 L 170 766 L 182 766 Z" fill="#5b554c"/><rect x="56" y="778" width="660" height="54" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="76" y="800" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#1f1c19" text-anchor="start" xml:space="preserve">tool_result returns to the model</text><text x="76" y="820" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8f887a" text-anchor="start">and the loop continues (more events: Stop, SubagentStart/Stop, PreCompact&#8230;)</text><text x="772" y="108" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#8f887a" text-anchor="start" xml:space="preserve">THIS APP, LIVE (2026-07-04)</text><rect x="772" y="124" width="412" height="118" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="790" y="150" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#1f1c19" text-anchor="start" xml:space="preserve">rm sales.csv &amp;&amp; ls -la</text><text x="790" y="170" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b554c" text-anchor="start">denied by the hook in 0.01s. Zero cards,</text><text x="790" y="188" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b554c" text-anchor="start">zero humans, reason quoted back by the model,</text><text x="790" y="206" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b554c" text-anchor="start">one "blocked" line in audit.jsonl.</text><text x="790" y="228" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8f887a" text-anchor="start" xml:space="preserve">part of the $0.0305 cleanup run</text><rect x="772" y="258" width="412" height="100" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="790" y="284" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#1f1c19" text-anchor="start" xml:space="preserve">wc -l sales.csv  (Part 7's ghost)</text><text x="790" y="304" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b554c" text-anchor="start">still no card, still auto-approved. But now</text><text x="790" y="322" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b554c" text-anchor="start">PostToolUse logged it: tool, input, output, id.</text><text x="790" y="344" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8f887a" text-anchor="start" xml:space="preserve">$0.0231 &#183; 5s &#183; 0 cards &#183; 1 audit line</text><rect x="772" y="374" width="412" height="100" rx="12" fill="#ffffff" stroke="#e7e3d9" stroke-width="1.5" /><text x="790" y="400" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#1f1c19" text-anchor="start" xml:space="preserve">"what files are on my desk?"</text><text x="790" y="420" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b554c" text-anchor="start">UserPromptSubmit had already answered it:</text><text x="790" y="438" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b554c" text-anchor="start">zero tool calls, half the cost of the ls round.</text><text x="790" y="460" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#8f887a" text-anchor="start" xml:space="preserve">$0.0113 vs $0.0237 without the hook</text><rect x="772" y="490" width="412" height="130" rx="12" fill="#ffffff" stroke="#dcb09a" stroke-width="1.5" /><text x="790" y="516" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#b3441a" text-anchor="start" xml:space="preserve">ORDER, PROVEN LIVE</text><text x="790" y="540" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#1f1c19" text-anchor="start" xml:space="preserve">hook:rm &#8594; (callback never fired)</text><text x="790" y="560" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#1f1c19" text-anchor="start" xml:space="preserve">hook:touch &#8594; callback:touch</text><text x="790" y="584" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b554c" text-anchor="start">A PreToolUse deny short-circuits can_use_tool</text><text x="790" y="602" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#5b554c" text-anchor="start">entirely. The law reads the request first.</text><text x="772" y="672" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f1c19">Approvals are judgment.</text><text x="772" y="700" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f1c19">Hooks are <tspan font-style="italic" fill="#b3441a">law</tspan>: deterministic,</text><text x="772" y="728" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#1f1c19">first, and always awake.</text><text x="772" y="758" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">Different failure modes, on purpose: judgment gets</text><text x="772" y="776" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">tired and clicks Approve; law blocks the thousandth</text><text x="772" y="794" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#5b554c" text-anchor="start">rm exactly like the first.</text>
</svg>