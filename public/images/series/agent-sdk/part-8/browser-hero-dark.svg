  <text x="275" y="684" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#4ade80">&#x2713;</text>
  <text x="296" y="684" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d6d3d1">Create trash folder and move sales.csv int…</text>
  <text x="722" y="683" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="end">BASH</text>
  <path d="M 734 676 l 5 6 l 5 -6" fill="none" stroke="#78716c" stroke-width="1.8"/>
  <rect x="260" y="706" width="500" height="34" rx="10" fill="#292524" stroke="#292524" stroke-width="1"/>
  <text x="274" y="728" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#4ade80">&#x2713;</text>
  <text x="294" y="728" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d6d3d1">Approved</text>
  <text x="744" y="728" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="end">BASH</text>
  
  <text x="260" y="771" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"  fill="#e7e5e4">Now I'll record what happened:</text>
  <rect x="260" y="788" width="500" height="38" rx="10" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <text x="275" y="812" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#4ade80">&#x2713;</text>
  <text x="296" y="812" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d6d3d1">Writing cleanup_notes.md</text>
  <text x="722" y="811" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="end">WRITE</text>
  <path d="M 734 804 l 5 6 l 5 -6" fill="none" stroke="#78716c" stroke-width="1.8"/>
  <rect x="260" y="834" width="500" height="34" rx="10" fill="#292524" stroke="#292524" stroke-width="1"/>
  <text x="274" y="856" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#4ade80">&#x2713;</text>
  <text x="294" y="856" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#d6d3d1">Approved</text>
  <text x="744" y="856" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1" fill="#78716c" text-anchor="end">WRITE</text>
  
  <text x="260" y="899" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e7e5e4">Done. The workspace policy blocks rm, so I</text>
  <text x="260" y="923" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e7e5e4">moved sales.csv to .trash/ instead. See</text>
  <text x="260" y="947" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e7e5e4">cleanup_notes.md for the details.</text>
  <text x="260" y="978" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#78716c">$0.0305 · 18s</text>
