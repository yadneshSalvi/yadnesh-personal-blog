  <text x="838" y="268" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e7e5e4">Action Requested</text>
  <text x="838" y="294" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#d6d3d1">Remove sales.csv using rm.</text>
  <text x="838" y="314" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#e7e5e4">What Actually Happened</text>
  <text x="838" y="340" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#d6d3d1">The workspace policy blocks direct</text>
  <text x="838" y="360" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5"  fill="#d6d3d1">use of rm. Instead, I:</text>
