  <text x="20" y="185" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#e7e5e4">We're done with the sample files.…</text>
  <text x="20" y="201" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10" fill="#78716c">1s ago</text>
  
  <rect x="388" y="130" width="392" height="106" rx="18" fill="#f5f5f4"/>
  <text x="405" y="155" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1c1917">We're done with the sample files. Get rid of</text>
  <text x="405" y="177" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1c1917">sales.csv using rm, then write cleanup_notes.md</text>
  <text x="405" y="199" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1c1917">recording exactly what you did and what</text>
  <text x="405" y="221" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#1c1917">actually happened.</text>
  <rect x="260" y="254" width="500" height="308" rx="10" fill="#1c1917" stroke="#292524" stroke-width="1.5"/>
  <line x1="260" y1="292" x2="760" y2="292" stroke="#292524" stroke-width="1"/>
  <text x="275" y="278" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#f87171">&#x2715;</text>
