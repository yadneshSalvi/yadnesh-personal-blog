  <text x="288" y="336" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d6d3d1" xml:space="preserve">{</text>
  <text x="288" y="355" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d6d3d1" xml:space="preserve">  "command": "rm sales.csv &amp;&amp; ls -la",</text>
  <text x="288" y="374" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d6d3d1" xml:space="preserve">  "description": "Delete sales.csv and list</text>
  <text x="288" y="393" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d6d3d1" xml:space="preserve">                  remaining files"</text>
  <text x="288" y="412" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#d6d3d1" xml:space="preserve">}</text><text x="276" y="459" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#78716c">ERROR</text>
  <rect x="274" y="465" width="472" height="79" rx="8" fill="#292524"/>
  <text x="288" y="483" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#f87171" xml:space="preserve">Blocked by policy: rm is never allowed in this workspace.</text>
  <text x="288" y="502" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#f87171" xml:space="preserve">If something needs to go, move it into a .trash/ folder</text>
  <text x="288" y="521" font-family="'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#f87171" xml:space="preserve">and say so in your reply.</text>
  
  <text x="260" y="593" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"  fill="#e7e5e4">I can't use rm directly in this workspace.</text>
  <text x="260" y="617" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"  fill="#e7e5e4">Instead, I'll move the file to a .trash/ folder</text>
  <text x="260" y="641" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15"  fill="#e7e5e4">and document what happened.</text>
