    <text x="32" y="284" xml:space="preserve"> "input": {"command": <tspan fill="#d97676">"rm sales.csv &amp;&amp; ls -la"</tspan>}}</text>
    <text x="32" y="312" xml:space="preserve"></text>
    <text x="32" y="340" xml:space="preserve"><tspan fill="#756d62">$</tspan> grep -o '"outcome": "[a-z]*"' audit.jsonl | sort | uniq -c</text>
