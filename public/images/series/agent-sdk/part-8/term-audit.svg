  <g font-size="14.5" fill="#d8d2c6">
    <text x="32" y="88" xml:space="preserve"><tspan fill="#756d62">$</tspan> wc -l audit.jsonl</text>
    <text x="32" y="116" xml:space="preserve">       3 audit.jsonl        <tspan fill="#756d62"># one line per tool call, every conversation</tspan></text>
