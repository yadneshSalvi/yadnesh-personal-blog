    <text x="32" y="172" xml:space="preserve"><tspan fill="#756d62">$</tspan> grep '"blocked"' audit.jsonl</text>
    <text x="32" y="200" xml:space="preserve">{"ts": "2026-07-03T19:45:23+00:00", "workspace_id": "80c21497<tspan fill="#756d62">&#8230;</tspan>",</text>
    <text x="32" y="228" xml:space="preserve"> "outcome": <tspan fill="#d97676">"blocked"</tspan>, "tool": "Bash",</text>
