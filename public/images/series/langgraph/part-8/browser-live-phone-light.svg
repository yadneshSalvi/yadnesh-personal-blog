<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
    <title id="title">Lattice running on a phone</title>
    <desc id="desc">A professional mobile LangGraph chat interface with memory, responsive controls, and clear conversation bubbles.</desc>
    <rect width="1200" height="720" fill="#eef2ff"/><circle cx="220" cy="120" r="260" fill="#6458dc" opacity=".1"/>
    <text x="130" y="248" fill="#6458dc" font-family="Inter, sans-serif" font-size="12" font-weight="750" letter-spacing="2.4">LIVE ON VERCEL</text>
    <text x="130" y="296" fill="#172036" font-family="Inter, sans-serif" font-size="36" font-weight="720">Your LangGraph assistant,</text>
    <text x="130" y="340" fill="#172036" font-family="Inter, sans-serif" font-size="36" font-weight="720">ready on every screen.</text>
    <text x="130" y="382" fill="#68748b" font-family="Inter, sans-serif" font-size="15">Responsive threads, streaming, tools, and memory.</text>
    <g transform="translate(330 0)">
    <rect x="420" y="32" width="336" height="656" rx="46" fill="#ffffff" stroke="#d6dceb" stroke-width="3"/>
    <rect x="533" y="47" width="110" height="22" rx="11" fill="#eef2ff"/>

    <rect x="446" y="84" width="32" height="32" rx="12" fill="#6458dc"/>
    <path d="M 454.96 100h14.08M462 92.96000000000001v14.08M457.2 95.2l9.6 9.6M466.8 95.2l-9.6 9.6" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
    <text x="490" y="98" fill="#172036" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="700">Lattice</text>
    <text x="490" y="113" fill="#68748b" font-family="Inter, -apple-system, sans-serif" font-size="9">A LangGraph assistant</text>
    <rect x="650" y="86" width="80" height="28" rx="14" fill="#f8faff" stroke="#d6dceb"/><circle cx="666" cy="100" r="4" fill="#17a673"/><text x="678" y="104" fill="#68748b" font-family="Inter, sans-serif" font-size="9">Memory</text>
    <line x1="437" y1="132" x2="739" y2="132" stroke="#d6dceb"/>
    <rect x="442" y="146" width="268" height="38" rx="13" fill="#f8faff" stroke="#d6dceb"/><text x="458" y="170" fill="#172036" font-family="Inter, sans-serif" font-size="10.5">My name is Alex</text><rect x="716" y="146" width="22" height="38" rx="11" fill="#f8faff" stroke="#d6dceb"/><text x="727" y="171" fill="#172036" font-family="Inter, sans-serif" font-size="17" text-anchor="middle">＋</text>
    <text x="695" y="221" fill="#68748b" font-family="Inter, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.3" text-anchor="end">YOU</text>
    <rect x="519" y="232" width="176" height="46" rx="17" fill="#6458dc"/><text x="537" y="260" fill="#ffffff" font-family="Inter, sans-serif" font-size="11">What’s my name?</text>
    <text x="463" y="320" fill="#68748b" font-family="Inter, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.3">LATTICE</text>
    <rect x="463" y="331" width="218" height="56" rx="17" fill="#f8faff" stroke="#d6dceb"/><text x="481" y="355" fill="#172036" font-family="Inter, sans-serif" font-size="11.5">Your name is Alex.</text><text x="481" y="373" fill="#68748b" font-family="Inter, sans-serif" font-size="9.5">I remembered it in this thread.</text>
    <line x1="437" y1="586" x2="739" y2="586" stroke="#d6dceb"/>
    <rect x="445" y="605" width="286" height="50" rx="18" fill="#f8faff" stroke="#d6dceb"/><text x="463" y="635" fill="#68748b" font-family="Inter, sans-serif" font-size="10.5">Message this conversation…</text><circle cx="703" cy="630" r="18" fill="#6458dc"/><text x="703" y="635" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">↗</text>
    </g>
