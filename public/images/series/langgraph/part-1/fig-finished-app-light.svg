      <text x="80" y="340" fill="#68748b" font-family="Inter, -apple-system, sans-serif" font-size="12">Explain recursion in one…</text>
      <text x="80" y="371" fill="#68748b" font-family="Inter, -apple-system, sans-serif" font-size="12">What is 23 × 17?</text>
