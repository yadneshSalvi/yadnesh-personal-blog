    <text x="362" y="396" fill="#68748b" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="1.7" text-anchor="start">LATTICE</text>
    <rect x="362" y="409" width="470" height="68" rx="18" fill="#f8faff" stroke="#d6dceb"/>
    <text x="379" y="434" fill="#172036" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start">23 × 17 is 391. Tokyo has about</text>
<text x="379" y="452" fill="#172036" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" text-anchor="start">14 million people in the city proper.</text>
